<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stosup スポットテロップ</title>
<link rel="icon" href="/favicon.ico" />
<script src="/overlay/stosup-overlay.js"></script>
<style id="stosup-base-css">
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--page-bg, transparent) !important;
    overflow: hidden;
    font-family: var(--font-family, "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif);
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 26px;
  }

  /* ==================== 既定: broadcast (オンエア・テロップ ローワーサード) ==================== */
  .pickup-shell {
    max-width: 860px;
    width: 100%;
    contain: layout style;
    animation: telopWipe 0.34s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes telopWipe {
    from { opacity: 0; clip-path: inset(0 100% 0 0); transform: translateX(-12px); }
    to   { opacity: 1; clip-path: inset(0 0 0 0); transform: translateX(0); }
  }
  .pickup-plate {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 6px 18px 6px 10px;
    background: var(--accent, #d93829);
    color: #ffffff;
    border-radius: 2px 2px 0 0;
    margin-left: 12px;
    position: relative;
    z-index: 2;
  }
  .pickup-avatar {
    width: 34px;
    height: 34px;
    border-radius: 2px;
    object-fit: cover;
    border: 1.5px solid rgba(255, 255, 255, 0.85);
    background: #1f232b;
    flex-shrink: 0;
  }
  .pickup-author {
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 0.03em;
  }
  .pickup-badge {
    font-size: 11px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 2px;
    background: rgba(0, 0, 0, 0.28);
    color: #ffffff;
    letter-spacing: 0.04em;
  }
  .pickup-card {
    background: rgba(17, 19, 23, 0.95);
    color: #f7f8fa;
    padding: 20px 26px 22px;
    border-radius: 2px;
    border-top: 3px solid var(--accent, #d93829);
    border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
  }
  .pickup-message {
    font-size: 27px;
    line-height: 1.48;
    font-weight: 700;
    word-break: break-word;
  }

  /* ==================== editorial (クリーン・マガジン) ==================== */
  body[data-theme="editorial"] .pickup-plate {
    background: #1c1b18;
    color: #f8f5ef;
    margin-left: 0;
    padding: 7px 16px 7px 12px;
  }
  body[data-theme="editorial"] .pickup-avatar {
    border-radius: 50%;
    border-color: #c2593f;
  }
  body[data-theme="editorial"] .pickup-card {
    background: rgba(248, 245, 239, 0.97);
    color: #1c1b18;
    border: 1px solid #d4cdc0;
    border-top: 2px solid #1c1b18;
    border-radius: 0 3px 3px 3px;
    box-shadow: 0 8px 24px rgba(28, 27, 24, 0.12);
  }
  body[data-theme="editorial"] .pickup-message { font-weight: 600; }

  /* ==================== tactical (タクティカル・HUD) ==================== */
  body[data-theme="tactical"] .pickup-plate {
    background: var(--accent, #e5a93b);
    color: #121417;
    border-radius: 0;
    margin-left: 0;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 100%, 0 100%);
    padding-right: 26px;
  }
  body[data-theme="tactical"] .pickup-badge {
    background: #121417;
    color: #e5a93b;
  }
  body[data-theme="tactical"] .pickup-card {
    background: rgba(18, 20, 23, 0.94);
    color: #edebe4;
    border: 1px solid rgba(237, 235, 228, 0.24);
    border-top: 2px solid var(--accent, #e5a93b);
    border-radius: 0;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
    box-shadow: none;
  }

  /* ==================== variety (バラエティ・テロップ) ==================== */
  body[data-theme="variety"] .pickup-plate {
    background: #f5c518;
    color: #182033;
    border: 3px solid #182033;
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    margin-left: 16px;
  }
  body[data-theme="variety"] .pickup-avatar {
    border-radius: 50%;
    border: 2px solid #182033;
  }
  body[data-theme="variety"] .pickup-badge {
    background: #182033;
    color: #ffffff;
  }
  body[data-theme="variety"] .pickup-card {
    background: #fffdf7;
    color: #182033;
    border: 3.5px solid #182033;
    border-radius: 14px;
    box-shadow: 7px 7px 0 #182033;
  }
  body[data-theme="variety"] .pickup-message { font-weight: 900; }

  /* ==================== cinema (シネマ・クリア字幕) ==================== */
  body[data-theme="cinema"] .pickup-plate {
    background: transparent;
    color: #ffffff;
    margin-left: 0;
    padding: 0 0 6px 12px;
  }
  body[data-theme="cinema"] .pickup-author {
    paint-order: stroke fill;
    -webkit-text-stroke: 3.5px rgba(10, 12, 16, 0.92);
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
  }
  body[data-theme="cinema"] .pickup-card {
    background: transparent;
    color: #ffffff;
    border: none;
    border-left: 4px solid var(--accent, #f5c518);
    padding: 6px 16px;
    box-shadow: none;
  }
  body[data-theme="cinema"] .pickup-message {
    font-size: 30px;
    font-weight: 800;
    paint-order: stroke fill;
    -webkit-text-stroke: 5px rgba(10, 12, 16, 0.95);
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.85);
  }

  /* ==================== edge_glow (エッジ・グロウ) ==================== */
  body[data-theme="edge_glow"] .pickup-plate {
    background: rgba(9, 13, 22, 0.86);
    color: #bae6fd;
    border: 1px solid rgba(125, 211, 252, 0.35);
    border-bottom: none;
    border-radius: 5px 5px 0 0;
  }
  body[data-theme="edge_glow"] .pickup-avatar {
    border-radius: 50%;
    border: 1.5px solid rgba(125, 211, 252, 0.8);
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.45);
  }
  body[data-theme="edge_glow"] .pickup-author {
    color: #bae6fd;
    text-shadow: 0 0 6px rgba(56, 189, 248, 0.78), 0 0 12px rgba(56, 189, 248, 0.38);
  }
  body[data-theme="edge_glow"] .pickup-card {
    background: rgba(9, 13, 22, 0.8);
    color: #f8fafc;
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-left: 4px solid var(--accent, #38bdf8);
    border-radius: 0 6px 6px 6px;
    box-shadow: 0 12px 28px rgba(2, 6, 23, 0.56), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  body[data-theme="edge_glow"] .pickup-message {
    color: #ffffff;
    font-weight: 800;
    paint-order: stroke fill;
    -webkit-text-stroke: 2px rgba(8, 13, 24, 0.9);
    text-shadow:
      2px 0 3px rgba(56, 189, 248, 0.78),
      -2px 0 3px rgba(56, 189, 248, 0.78),
      0 2px 3px rgba(56, 189, 248, 0.78),
      0 -2px 3px rgba(56, 189, 248, 0.78),
      0 0 10px rgba(56, 189, 248, 0.62),
      0 0 22px rgba(56, 189, 248, 0.36);
  }

  body.has-custom-font,
  body.has-custom-font * {
    font-family: var(--font-family) !important;
  }
</style>
<style id="stosup-custom-css"></style>
</head>
<body data-theme="broadcast">
  <div id="stage"></div>
<script>
  const stage = document.getElementById('stage');
  const customStyleEl = document.getElementById('stosup-custom-css');
  const params = new URLSearchParams(location.search);
  const urlTheme = params.get('theme');
  const urlBg = params.get('bg');
  const urlFont = params.get('font');

  let enabled = true;
  let picked = { comment: null };
  let config = {
    pickup_theme: 'broadcast',
    pickup_bg_color: 'transparent',
    pickup_font_family: '',
    pickup_custom_css: '',
    visual_styles: {}
  };

  function applyDesign() {
    document.body.dataset.theme = StosupOverlay.normalizeTheme(urlTheme || config.pickup_theme);
    document.documentElement.style.setProperty('--page-bg', StosupOverlay.resolveBg(urlBg || config.pickup_bg_color));
    StosupOverlay.applyFont(urlFont || config.pickup_font_family);
    StosupOverlay.applyOverlayVisualStyle('pickup', config, {
      card: '.pickup-card',
      text: '.pickup-message',
      author: '.pickup-author',
      animate: '.pickup-shell'
    });
    StosupOverlay.applyCustomCss(customStyleEl, config.pickup_custom_css);
  }

  function render() {
    stage.innerHTML = '';
    if (!enabled || !picked || !picked.comment) return;
    const c = picked.comment;

    const shell = document.createElement('div');
    shell.className = 'pickup-shell';
    if (c.event_accent_color) {
      shell.style.setProperty('--accent', c.event_accent_color);
    }

    const plate = document.createElement('div');
    plate.className = 'pickup-plate';

    const img = document.createElement('img');
    img.className = 'pickup-avatar';
    img.src = c.user_icon_url || StosupOverlay.fallbackAvatar(c.user_name);
    img.onerror = () => { img.src = StosupOverlay.fallbackAvatar(c.user_name); };
    plate.appendChild(img);

    const author = document.createElement('span');
    author.className = 'pickup-author';
    author.textContent = c.user_name;
    plate.appendChild(author);

    if (c.amount_display) {
      const b = document.createElement('span');
      b.className = 'pickup-badge';
      b.textContent = c.amount_display;
      plate.appendChild(b);
    } else if (c.is_member) {
      const b = document.createElement('span');
      b.className = 'pickup-badge';
      b.textContent = 'MEMBER';
      plate.appendChild(b);
    }

    const card = document.createElement('div');
    card.className = 'pickup-card';
    const msg = document.createElement('div');
    msg.className = 'pickup-message';
    StosupOverlay.renderMessageRuns(msg, c.message, c.message_runs);
    card.appendChild(msg);

    shell.appendChild(plate);
    shell.appendChild(card);
    stage.appendChild(shell);
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(window.StosupOverlay.buildWsUrl('pickup'));
    ws.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.type === 'snapshot') {
          config = Object.assign(config, data.config || {});
          picked = data.picked_comment || { comment: null };
          if (typeof data.pickup_enabled === 'boolean') enabled = data.pickup_enabled;
          applyDesign();
          render();
        } else if (data.type === 'picked_comment') {
          picked = data.picked || { comment: null };
          if (typeof data.enabled === 'boolean') enabled = data.enabled;
          render();
        } else if (data.type === 'config_updated') {
          config = Object.assign(config, data.config || {});
          applyDesign();
        }
      } catch (e) { console.error(e); }
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }
  applyDesign();
  connect();
</script>
</body>
</html>
