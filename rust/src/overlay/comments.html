<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stosup トークモニター</title>
<link rel="icon" href="/favicon.ico" />
<script src="/overlay/stosup-overlay.js"></script>
<style id="stosup-base-css">
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--page-bg, transparent) !important;
    overflow: hidden;
    font-family: var(--font-family, "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif);
    -webkit-font-smoothing: antialiased;
  }
  #container {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 8px;
    width: 100%;
    height: 100%;
    padding: 14px 16px;
  }

  /* ==================== 既定: broadcast (オンエア・テロップ) ==================== */
  .comment-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    max-width: 100%;
    contain: layout style;
    animation: broadcastIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes broadcastIn {
    from { opacity: 0; transform: translateX(-14px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 3px;
    object-fit: cover;
    flex-shrink: 0;
    border: 1.5px solid rgba(255, 255, 255, 0.22);
    background: #1f232b;
  }
  .bubble {
    position: relative;
    padding: 8px 14px 9px 15px;
    border-radius: 2px;
    background: var(--default-bg, rgba(17, 19, 23, 0.92));
    color: var(--default-fg, #f7f8fa);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-left: 4px solid var(--accent, #d93829);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.34);
    max-width: calc(100% - 50px);
    word-break: break-word;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
    font-size: 0.74em;
    letter-spacing: 0.02em;
  }
  .author {
    font-weight: 800;
    color: #e4e7ee;
  }
  .badge {
    font-size: 0.68em;
    padding: 1px 6px;
    border-radius: 2px;
    font-weight: 800;
    letter-spacing: 0.04em;
    line-height: 1.45;
  }
  .badge-owner { background: #d93829; color: #ffffff; }
  .badge-mod { background: #2c5f8a; color: #ffffff; }
  .badge-member { background: #1d6f42; color: #ffffff; }
  .badge-first { background: #b45309; color: #ffffff; }
  .badge-monetization {
    background: var(--event-accent, #e5a93b);
    color: #111317;
    font-weight: 900;
  }
  .bubble.monetization {
    border-left: 5px solid var(--event-accent, #e5a93b) !important;
    background: rgba(24, 22, 18, 0.95);
  }
  .timestamp {
    margin-left: auto;
    font-size: 0.7em;
    opacity: 0.55;
    font-variant-numeric: tabular-nums;
  }
  .message {
    line-height: 1.46;
    font-weight: 600;
  }

  /* ==================== editorial (クリーン・マガジン) ==================== */
  body[data-theme="editorial"] .avatar {
    border-radius: 50%;
    border: 1px solid #d4cdc0;
  }
  body[data-theme="editorial"] .bubble {
    background: rgba(248, 245, 239, 0.96);
    color: #1c1b18;
    border: 1px solid #dcd5c9;
    border-left: 3px solid var(--accent, #c2593f);
    border-radius: 3px;
    padding: 9px 15px;
    box-shadow: 0 2px 10px rgba(28, 27, 24, 0.09);
  }
  body[data-theme="editorial"] .author {
    color: #5c574f;
    letter-spacing: 0.04em;
  }
  body[data-theme="editorial"] .timestamp { color: #7a746a; opacity: 1; }
  body[data-theme="editorial"] .message { font-weight: 500; }

  /* ==================== tactical (タクティカル・HUD) ==================== */
  body[data-theme="tactical"] .avatar {
    border-radius: 0;
    border: 1.5px solid rgba(229, 169, 59, 0.7);
    clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 0 100%);
  }
  body[data-theme="tactical"] .bubble {
    background: rgba(18, 20, 23, 0.93);
    color: #edebe4;
    border: 1px solid rgba(237, 235, 228, 0.18);
    border-left: 3px solid var(--accent, #e5a93b);
    border-radius: 0;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    box-shadow: none;
    padding: 8px 16px 9px 14px;
  }
  body[data-theme="tactical"] .author {
    color: var(--accent, #e5a93b);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
  }

  /* ==================== variety (バラエティ・テロップ) ==================== */
  body[data-theme="variety"] .avatar {
    border-radius: 10px;
    border: 2.5px solid #182033;
    box-shadow: 2px 2px 0 #182033;
  }
  body[data-theme="variety"] .bubble {
    background: #fffdf7;
    color: #182033;
    border: 2.5px solid #182033;
    border-radius: 10px;
    border-top-left-radius: 2px;
    box-shadow: 4px 4px 0 #182033;
    padding: 9px 15px;
  }
  body[data-theme="variety"] .author {
    color: #182033;
    background: #f5c518;
    padding: 1px 7px;
    border-radius: 3px;
    font-weight: 900;
  }
  body[data-theme="variety"] .message { font-weight: 800; }

  /* ==================== cinema (シネマ・クリア字幕) ==================== */
  body[data-theme="cinema"] .comment-row { gap: 8px; }
  body[data-theme="cinema"] .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.65);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.65);
  }
  body[data-theme="cinema"] .bubble {
    background: transparent;
    color: #ffffff;
    border: none;
    border-left: 2.5px solid rgba(255, 255, 255, 0.6);
    border-radius: 0;
    padding: 2px 10px;
    box-shadow: none;
  }
  body[data-theme="cinema"] .author {
    color: #f4f4f5;
    paint-order: stroke fill;
    -webkit-text-stroke: 3px rgba(10, 12, 16, 0.92);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
  }
  body[data-theme="cinema"] .message {
    font-weight: 700;
    paint-order: stroke fill;
    -webkit-text-stroke: 3.5px rgba(10, 12, 16, 0.92);
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
  }

  /* ==================== edge_glow (エッジ・グロウ) ==================== */
  body[data-theme="edge_glow"] .avatar {
    border-radius: 50%;
    border: 1.5px solid rgba(125, 211, 252, 0.72);
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.42);
  }
  body[data-theme="edge_glow"] .bubble {
    background: rgba(9, 13, 22, 0.78);
    color: #f8fafc;
    border: 1px solid rgba(148, 163, 184, 0.24);
    border-left: 3px solid var(--accent, #38bdf8);
    border-radius: 4px;
    box-shadow: 0 6px 18px rgba(2, 6, 23, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  body[data-theme="edge_glow"] .author {
    color: #bae6fd;
    text-shadow:
      0 0 4px rgba(56, 189, 248, 0.78),
      0 0 10px rgba(56, 189, 248, 0.38);
  }
  body[data-theme="edge_glow"] .message {
    color: #f8fafc;
    font-weight: 700;
    paint-order: stroke fill;
    -webkit-text-stroke: 1.5px rgba(8, 13, 24, 0.88);
    text-shadow:
      1px 0 2px rgba(56, 189, 248, 0.72),
      -1px 0 2px rgba(56, 189, 248, 0.72),
      0 1px 2px rgba(56, 189, 248, 0.72),
      0 -1px 2px rgba(56, 189, 248, 0.72),
      0 0 7px rgba(56, 189, 248, 0.56),
      0 0 14px rgba(56, 189, 248, 0.32);
  }

  body.has-custom-font,
  body.has-custom-font * {
    font-family: var(--font-family) !important;
  }
</style>
<style id="stosup-custom-css"></style>
</head>
<body data-theme="broadcast">
  <div id="container"></div>
<script>
  const container = document.getElementById('container');
  const customStyleEl = document.getElementById('stosup-custom-css');
  const params = new URLSearchParams(location.search);
  const urlTheme = params.get('theme');
  const urlBg = params.get('bg');
  const urlFont = params.get('font');

  let config = {
    comment_font_size: 18,
    comment_max_items: 30,
    show_icons: true,
    show_timestamps: false,
    default_bubble_bg: '#111317EB',
    default_text_color: '#F7F8FA',
    comments_theme: 'broadcast',
    comments_bg_color: 'transparent',
    comments_font_family: '',
    comments_custom_css: '',
    visual_styles: {}
  };
  let comments = [];

  function applyConfig() {
    const theme = StosupOverlay.normalizeTheme(urlTheme || config.comments_theme);
    document.body.dataset.theme = theme;
    document.documentElement.style.setProperty('--page-bg', StosupOverlay.resolveBg(urlBg || config.comments_bg_color));
    StosupOverlay.applyFont(urlFont || config.comments_font_family);
    if (theme === 'broadcast') {
      document.documentElement.style.setProperty('--default-bg', config.default_bubble_bg || 'rgba(17,19,23,0.92)');
      document.documentElement.style.setProperty('--default-fg', config.default_text_color || '#f7f8fa');
    } else {
      document.documentElement.style.removeProperty('--default-bg');
      document.documentElement.style.removeProperty('--default-fg');
    }
    container.style.fontSize = (config.comment_font_size || 18) + 'px';
    StosupOverlay.applyOverlayVisualStyle('comments', config, {
      card: '.bubble',
      text: '.message',
      author: '.author',
      animate: '.comment-row'
    });
    StosupOverlay.applyCustomCss(customStyleEl, config.comments_custom_css);
  }

  function formatTime(ms) {
    const d = new Date(ms);
    return d.toTimeString().slice(0, 8);
  }

  function buildCommentNode(c) {
    const row = document.createElement('div');
    row.className = 'comment-row';
    row.dataset.id = c.id;

    if (config.show_icons) {
      const img = document.createElement('img');
      img.className = 'avatar';
      img.src = c.user_icon_url || StosupOverlay.fallbackAvatar(c.user_name);
      img.onerror = () => { img.src = StosupOverlay.fallbackAvatar(c.user_name); };
      row.appendChild(img);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (c.event_kind) {
      bubble.classList.add('monetization');
      if (c.event_accent_color) {
        bubble.style.setProperty('--event-accent', c.event_accent_color);
      }
    }
    if (c.bubble_bg_color) bubble.style.background = c.bubble_bg_color;
    if (c.bubble_text_color) bubble.style.color = c.bubble_text_color;
    if (c.bubble_border_color) {
      bubble.style.borderLeftColor = c.bubble_border_color;
    }

    const header = document.createElement('div');
    header.className = 'header';

    const author = document.createElement('span');
    author.className = 'author';
    author.textContent = c.user_name;
    header.appendChild(author);

    if (c.amount_display) {
      const b = document.createElement('span');
      b.className = 'badge badge-monetization';
      b.textContent = c.amount_display;
      header.appendChild(b);
    }
    if (c.is_first_time) {
      const b = document.createElement('span');
      b.className = 'badge badge-first';
      b.textContent = '初見';
      header.appendChild(b);
    }
    if (c.is_owner) {
      const b = document.createElement('span');
      b.className = 'badge badge-owner';
      b.textContent = '配信者';
      header.appendChild(b);
    }
    if (c.is_moderator) {
      const b = document.createElement('span');
      b.className = 'badge badge-mod';
      b.textContent = 'MOD';
      header.appendChild(b);
    }
    if (c.is_member) {
      const b = document.createElement('span');
      b.className = 'badge badge-member';
      b.textContent = 'メンバー';
      header.appendChild(b);
    }
    if (config.show_timestamps) {
      const ts = document.createElement('span');
      ts.className = 'timestamp';
      ts.textContent = formatTime(c.timestamp_ms);
      header.appendChild(ts);
    }

    const msg = document.createElement('div');
    msg.className = 'message';
    StosupOverlay.renderMessageRuns(msg, c.message, c.message_runs);

    bubble.appendChild(header);
    bubble.appendChild(msg);
    row.appendChild(bubble);
    return row;
  }

  function renderAll() {
    container.innerHTML = '';
    const maxItems = config.comment_max_items || 30;
    const slice = comments.slice(-maxItems);
    const frag = document.createDocumentFragment();
    for (const c of slice) {
      frag.appendChild(buildCommentNode(c));
    }
    container.appendChild(frag);
  }

  function appendComment(c) {
    comments.push(c);
    const maxItems = config.comment_max_items || 30;
    if (comments.length > maxItems * 2) {
      comments = comments.slice(-maxItems);
    }
    container.appendChild(buildCommentNode(c));
    while (container.children.length > maxItems) {
      container.removeChild(container.firstChild);
    }
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(window.StosupOverlay.buildWsUrl('comments'));
    ws.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.type === 'snapshot') {
          if (data.mods) window.StosupOverlay.syncMods(data.mods, data.mods_revision);
          config = Object.assign(config, data.config || {});
          comments = data.comments || [];
          applyConfig();
          renderAll();
        } else if (data.type === 'mods_updated') {
          window.StosupOverlay.syncMods(data.mods, data.revision);
          applyConfig();
        } else if (data.type === 'comment') {
          if (data.comment) appendComment(data.comment);
        } else if (data.type === 'config_updated') {
          const prevShowIcons = config.show_icons;
          const prevShowTs = config.show_timestamps;
          const prevMaxItems = config.comment_max_items;
          config = Object.assign(config, data.config || {});
          applyConfig();
          // DOM 構造が変わる設定（アイコン/時刻/最大件数）が変化した時だけ再構築し、CSS 調整時の全DOM破棄・ちらつきを防止
          if (
            config.show_icons !== prevShowIcons ||
            config.show_timestamps !== prevShowTs ||
            config.comment_max_items !== prevMaxItems
          ) {
            renderAll();
          }
        }
      } catch (e) {
        console.error(e);
      }
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }

  applyConfig();
  connect();
</script>
</body>
</html>
