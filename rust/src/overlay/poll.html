<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stosup リアルタイム投票オーバーレイ</title>
<link rel="icon" href="/favicon.ico" />
<style id="stosup-base-css">
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--page-bg, transparent) !important;
    overflow: hidden;
    font-family: var(--font-family, "Yu Gothic UI", "Meiryo", "Segoe UI", sans-serif);
  }
  #wrap {
    padding: 16px;
    width: 100%;
  }
  .poll-card {
    background: rgba(24, 24, 27, 0.94);
    border: 1.5px solid #3f3f46;
    border-radius: 12px;
    padding: 18px 20px 14px;
    color: #f4f4f5;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.42);
    max-width: 680px;
    animation: cardIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .poll-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .poll-status {
    font-size: 11px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 4px;
    background: #16a34a;
    color: #ffffff;
    flex-shrink: 0;
    transition: background-color 0.25s ease;
  }
  .poll-status.closed { background: #71717a; }
  .poll-question {
    font-size: 19px;
    font-weight: 800;
    flex: 1;
    line-height: 1.3;
  }
  .poll-total {
    font-size: 13px;
    color: #a1a1aa;
    font-weight: 700;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    transition: transform 0.2s ease, color 0.2s ease;
  }
  .poll-total.bump {
    transform: scale(1.14);
    color: #f4f4f5;
  }
  .poll-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .poll-opt {
    position: relative;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    overflow: hidden;
    padding: 10px 14px;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .poll-opt.leader {
    border-color: var(--opt-color, #3b82f6);
    box-shadow: 0 0 0 1px var(--opt-color, #3b82f6);
  }
  .poll-bar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0%;
    background: var(--opt-color, #3b82f6);
    opacity: 0.32;
    transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
    will-change: width;
  }
  .poll-bar::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.45) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    transform: translateX(-120%);
    pointer-events: none;
  }
  .poll-opt.pulse .poll-bar {
    opacity: 0.48;
  }
  .poll-opt.pulse .poll-bar::after {
    animation: barFlash 0.65s ease-out;
  }
  @keyframes barFlash {
    from { transform: translateX(-120%); }
    to   { transform: translateX(120%); }
  }
  .poll-opt-row {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .poll-num {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: var(--opt-color, #3b82f6);
    color: #ffffff;
    font-weight: 900;
    font-size: 13.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.22s ease;
  }
  .poll-opt.pulse .poll-num {
    transform: scale(1.16);
  }
  .poll-label {
    font-size: 15.5px;
    font-weight: 700;
    flex: 1;
  }
  .poll-stats {
    font-size: 14.5px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .poll-opt.pulse .poll-stats {
    transform: scale(1.14);
  }
  .poll-footer {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 12.5px;
    line-height: 1.45;
    color: #d4d4d8;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .poll-footer-badge {
    font-size: 11px;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(59, 130, 246, 0.22);
    color: #93c5fd;
    flex-shrink: 0;
  }

  /* minimal */
  body[data-theme="minimal"] .poll-card {
    background: rgba(15, 15, 18, 0.72);
    border: none;
    border-left: 4px solid #3b82f6;
    border-radius: 0 8px 8px 0;
    box-shadow: none;
  }

  /* pop */
  body[data-theme="pop"] .poll-card {
    background: #ffffff;
    color: #18181b;
    border: 3px solid #18181b;
    border-radius: 16px;
    box-shadow: 5px 5px 0 #18181b;
  }
  body[data-theme="pop"] .poll-total { color: #52525b; }
  body[data-theme="pop"] .poll-total.bump { color: #18181b; }
  body[data-theme="pop"] .poll-opt {
    background: #f4f4f5;
    border: 2px solid #18181b;
  }
  body[data-theme="pop"] .poll-footer {
    border-top-color: #d4d4d8;
    color: #3f3f46;
  }
  body[data-theme="pop"] .poll-footer-badge {
    background: #18181b;
    color: #ffffff;
  }

  /* neon */
  body[data-theme="neon"] .poll-card {
    background: rgba(9, 11, 20, 0.92);
    border: 2px solid #22d3ee;
    box-shadow: 0 0 22px rgba(34, 211, 238, 0.3);
  }
  body[data-theme="neon"] .poll-question { color: #ecfeff; }
  body[data-theme="neon"] .poll-bar { opacity: 0.42; }
  body[data-theme="neon"] .poll-footer {
    border-top-color: rgba(34, 211, 238, 0.28);
    color: #cffafe;
  }
  body[data-theme="neon"] .poll-footer-badge {
    background: rgba(34, 211, 238, 0.22);
    color: #67e8f9;
  }

  /* pastel */
  body[data-theme="pastel"] .poll-card {
    background: rgba(255, 251, 245, 0.97);
    color: #27272a;
    border: 2.5px solid #f9a8d4;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14);
  }
  body[data-theme="pastel"] .poll-total { color: #71717a; }
  body[data-theme="pastel"] .poll-total.bump { color: #27272a; }
  body[data-theme="pastel"] .poll-opt {
    background: #fff5f8;
    border-color: #fbcfe8;
  }
  body[data-theme="pastel"] .poll-footer {
    border-top-color: #fbcfe8;
    color: #52525b;
  }
  body[data-theme="pastel"] .poll-footer-badge {
    background: #fce7f3;
    color: #be185d;
  }

  body.has-custom-font,
  body.has-custom-font * {
    font-family: var(--font-family) !important;
  }
</style>
<style id="stosup-custom-css"></style>
</head>
<body data-theme="default">
  <div id="wrap"></div>
<script>
  const wrap = document.getElementById('wrap');
  const customStyleEl = document.getElementById('stosup-custom-css');
  const params = new URLSearchParams(location.search);
  const urlTheme = params.get('theme');
  const urlBg = params.get('bg');
  const urlFont = params.get('font');

  let enabled = true;
  let cleared = false;
  let poll = null;
  let config = {
    poll_theme: 'default',
    poll_bg_color: 'transparent',
    poll_font_family: '',
    poll_custom_css: ''
  };

  // DOM 差分更新用キャッシュ（バー幅の CSS トランジションを滑らかに発火させる）
  let domCache = null;
  let prevTotalVotes = null;
  let prevVotesById = new Map();

  function applyFont(raw) {
    const f = (raw || '').trim();
    if (f) {
      const safe = f.replace(/["\\]/g, '');
      document.documentElement.style.setProperty('--font-family', `"${safe}", "Yu Gothic UI", "Meiryo", sans-serif`);
      document.body.classList.add('has-custom-font');
    } else {
      document.documentElement.style.removeProperty('--font-family');
      document.body.classList.remove('has-custom-font');
    }
  }
  function resolveBg(raw) {
    const v = (raw || 'transparent').trim();
    if (!v || v.toLowerCase() === 'transparent') return 'transparent';
    if (/^[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$/.test(v)) return '#' + v;
    if (/^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$/.test(v)) return v;
    return 'transparent';
  }
  function applyDesign() {
    document.body.dataset.theme = urlTheme || config.poll_theme || 'default';
    document.documentElement.style.setProperty('--page-bg', resolveBg(urlBg || config.poll_bg_color));
    applyFont(urlFont || config.poll_font_family);
    customStyleEl.textContent = config.poll_custom_css || '';
  }

  function buildFooterGuide(p) {
    const count = (p.config && p.config.options) ? p.config.options.length : 0;
    if (!p.is_active) {
      return {
        badge: '結果',
        text: '投票は締め切りました。たくさんのご参加ありがとうございました！'
      };
    }
    const hasWordKw = (p.config.options || []).some((o, i) =>
      (o.keywords || []).some(k => String(k).trim() !== '' && String(k).trim() !== String(i + 1))
    );
    const how = hasWordKw
      ? `コメントに番号（1〜${count}）またはキーワードを入力して投票できます`
      : `コメントに番号（1〜${count}）を入力して投票できます`;
    const rule = p.config.allow_vote_change !== false
      ? '（1人1票・再コメントで変更可）'
      : '（1人1票・変更不可）';
    return { badge: '投票方法', text: `${how}${rule}` };
  }

  function structureKey(p) {
    const opts = (p && p.config && p.config.options) || [];
    return opts.map((o) => `${o.id}:${o.color || ''}`).join('|');
  }

  function buildDom(p) {
    wrap.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'poll-card';

    const header = document.createElement('div');
    header.className = 'poll-header';
    const badge = document.createElement('span');
    badge.className = 'poll-status';
    const q = document.createElement('div');
    q.className = 'poll-question';
    const totalEl = document.createElement('div');
    totalEl.className = 'poll-total';
    header.appendChild(badge);
    header.appendChild(q);
    header.appendChild(totalEl);
    card.appendChild(header);

    const optsWrap = document.createElement('div');
    optsWrap.className = 'poll-options';
    const optMap = new Map();

    p.config.options.forEach((opt, idx) => {
      const el = document.createElement('div');
      el.className = 'poll-opt';
      el.style.setProperty('--opt-color', opt.color || '#3b82f6');

      const bar = document.createElement('div');
      bar.className = 'poll-bar';
      bar.style.width = '0%';

      const row = document.createElement('div');
      row.className = 'poll-opt-row';

      const num = document.createElement('div');
      num.className = 'poll-num';
      num.textContent = String(idx + 1);

      const label = document.createElement('div');
      label.className = 'poll-label';

      const stats = document.createElement('div');
      stats.className = 'poll-stats';

      row.appendChild(num);
      row.appendChild(label);
      row.appendChild(stats);
      el.appendChild(bar);
      el.appendChild(row);
      optsWrap.appendChild(el);
      optMap.set(opt.id, { el, bar, label, stats, pulseTimer: null });
    });

    card.appendChild(optsWrap);

    const footer = document.createElement('div');
    footer.className = 'poll-footer';
    const footerBadge = document.createElement('span');
    footerBadge.className = 'poll-footer-badge';
    const footerText = document.createElement('span');
    footerText.className = 'poll-footer-text';
    footer.appendChild(footerBadge);
    footer.appendChild(footerText);
    card.appendChild(footer);

    wrap.appendChild(card);

    domCache = {
      key: structureKey(p),
      badge,
      q,
      totalEl,
      optMap,
      footerBadge,
      footerText,
      totalTimer: null
    };
  }

  function render() {
    if (!enabled || cleared || !poll || !poll.config || !poll.config.options || poll.config.options.length === 0) {
      wrap.innerHTML = '';
      domCache = null;
      prevTotalVotes = null;
      prevVotesById.clear();
      return;
    }
    if (!poll.is_active && poll.total_votes === 0 && !poll.ended_at_ms) {
      wrap.innerHTML = '';
      domCache = null;
      prevTotalVotes = null;
      prevVotesById.clear();
      return;
    }

    const nextKey = structureKey(poll);
    const isFreshDom = !domCache || domCache.key !== nextKey;
    if (isFreshDom) {
      buildDom(poll);
    }

    domCache.badge.className = 'poll-status' + (poll.is_active ? '' : ' closed');
    domCache.badge.textContent = poll.is_active ? '投票受付中' : '受付終了';
    domCache.q.textContent = poll.config.question || 'アンケート';

    const total = poll.total_votes || 0;
    domCache.totalEl.textContent = `計 ${total} 票`;
    if (prevTotalVotes !== null && prevTotalVotes !== total) {
      domCache.totalEl.classList.remove('bump');
      void domCache.totalEl.offsetWidth;
      domCache.totalEl.classList.add('bump');
      if (domCache.totalTimer) clearTimeout(domCache.totalTimer);
      domCache.totalTimer = setTimeout(() => {
        if (domCache) domCache.totalEl.classList.remove('bump');
      }, 260);
    }
    prevTotalVotes = total;

    const maxVotes = Math.max(0, ...poll.config.options.map(o => o.vote_count || 0));

    poll.config.options.forEach((opt) => {
      const refs = domCache.optMap.get(opt.id);
      if (!refs) return;
      const votes = opt.vote_count || 0;
      const pct = total > 0 ? Math.round((votes / total) * 100) : 0;
      const prevVotes = prevVotesById.get(opt.id);
      const changed = prevVotes !== undefined && prevVotes !== votes;
      prevVotesById.set(opt.id, votes);

      refs.label.textContent = opt.label;
      refs.el.classList.toggle('leader', maxVotes > 0 && votes === maxVotes);

      const parts = [];
      if (poll.config.show_percentage !== false) parts.push(`${pct}%`);
      if (poll.config.show_vote_count !== false) parts.push(`${votes}票`);
      refs.stats.textContent = parts.join(' / ');

      // 初回表示時も次フレームで 0% -> pct% へ滑らかに伸ばす
      if (isFreshDom) {
        requestAnimationFrame(() => {
          refs.bar.style.width = `${pct}%`;
        });
      } else {
        refs.bar.style.width = `${pct}%`;
      }

      if (changed) {
        refs.el.classList.remove('pulse');
        void refs.el.offsetWidth;
        refs.el.classList.add('pulse');
        if (refs.pulseTimer) clearTimeout(refs.pulseTimer);
        refs.pulseTimer = setTimeout(() => {
          refs.el.classList.remove('pulse');
        }, 680);
      }
    });

    const guide = buildFooterGuide(poll);
    domCache.footerBadge.textContent = guide.badge;
    domCache.footerText.textContent = guide.text;
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/ws?channel=poll`);
    ws.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.type === 'snapshot') {
          config = Object.assign(config, data.config || {});
          poll = data.poll_state || null;
          if (typeof data.poll_enabled === 'boolean') enabled = data.poll_enabled;
          cleared = false;
          applyDesign();
          render();
        } else if (data.type === 'poll') {
          poll = data.poll || null;
          if (typeof data.enabled === 'boolean') enabled = data.enabled;
          cleared = false;
          render();
        } else if (data.type === 'clear_poll') {
          cleared = true;
          render();
        } else if (data.type === 'config_updated') {
          config = Object.assign(config, data.config || {});
          applyDesign();
        }
      } catch (e) { console.error(e); }
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }
  applyDesign();
  connect();
</script>
</body>
</html>
