<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stosup ライブアンケート</title>
<link rel="icon" href="/favicon.ico" />
<script src="/overlay/stosup-overlay.js"></script>
<style id="stosup-base-css">
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--page-bg, transparent) !important;
    overflow: hidden;
    font-family: var(--font-family, "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif);
    -webkit-font-smoothing: antialiased;
  }
  #wrap {
    padding: 16px;
    width: 100%;
  }

  /* ==================== 既定: broadcast (速報投票ボード) ==================== */
  .poll-card {
    background: rgba(17, 19, 23, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-top: 4px solid var(--accent, #d93829);
    border-radius: 2px;
    padding: 16px 20px 14px;
    color: #f7f8fa;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.42);
    max-width: 680px;
    contain: layout style;
    animation: boardIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes boardIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .poll-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }
  .poll-status {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.08em;
    padding: 3px 9px;
    border-radius: 2px;
    background: #d93829;
    color: #ffffff;
    flex-shrink: 0;
  }
  .poll-status.closed { background: #4b5563; }
  .poll-question {
    font-size: 19px;
    font-weight: 800;
    flex: 1;
    line-height: 1.32;
  }
  .poll-total {
    font-size: 13px;
    color: #9aa2b1;
    font-weight: 800;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    transition: transform 0.2s ease, color 0.2s ease;
  }
  .poll-total.bump { transform: scale(1.12); color: #ffffff; }
  .poll-options {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .poll-opt {
    position: relative;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    overflow: hidden;
    padding: 10px 14px;
    contain: layout style;
    transition: border-color 0.25s ease;
  }
  .poll-opt.leader {
    border-color: var(--opt-color, #d93829);
  }
  .poll-bar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 100%;
    transform-origin: left center;
    transform: scaleX(0);
    background: var(--opt-color, #d93829);
    opacity: 0.3;
    transition: transform 0.52s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .poll-opt-row {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .poll-num {
    width: 26px;
    height: 26px;
    border-radius: 2px;
    background: var(--opt-color, #d93829);
    color: #ffffff;
    font-weight: 900;
    font-size: 13.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .poll-label {
    font-size: 15.5px;
    font-weight: 700;
    flex: 1;
  }
  .poll-stats {
    font-size: 15px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
  }
  .poll-footer {
    margin-top: 12px;
    padding-top: 9px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 12px;
    color: #b4bac6;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .poll-footer-badge {
    font-size: 10.5px;
    font-weight: 900;
    letter-spacing: 0.06em;
    padding: 2px 7px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.12);
    color: #f7f8fa;
    flex-shrink: 0;
  }

  /* ==================== editorial ==================== */
  body[data-theme="editorial"] .poll-card {
    background: rgba(248, 245, 239, 0.97);
    color: #1c1b18;
    border: 1px solid #d4cdc0;
    border-top: 3px solid #1c1b18;
    box-shadow: 0 6px 20px rgba(28, 27, 24, 0.1);
  }
  body[data-theme="editorial"] .poll-header { border-bottom-color: #dfd8cc; }
  body[data-theme="editorial"] .poll-status { background: #c2593f; }
  body[data-theme="editorial"] .poll-total { color: #6e6a62; }
  body[data-theme="editorial"] .poll-opt {
    background: rgba(28, 27, 24, 0.03);
    border-color: #dcd5c9;
  }
  body[data-theme="editorial"] .poll-footer {
    border-top-color: #dfd8cc;
    color: #5c574f;
  }
  body[data-theme="editorial"] .poll-footer-badge {
    background: #1c1b18;
    color: #f8f5ef;
  }

  /* ==================== tactical ==================== */
  body[data-theme="tactical"] .poll-card {
    background: rgba(18, 20, 23, 0.94);
    color: #edebe4;
    border: 1px solid rgba(237, 235, 228, 0.22);
    border-top: 3px solid var(--accent, #e5a93b);
    border-radius: 0;
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
    box-shadow: none;
  }
  body[data-theme="tactical"] .poll-status { background: #e5a93b; color: #121417; border-radius: 0; }
  body[data-theme="tactical"] .poll-opt { border-radius: 0; }
  body[data-theme="tactical"] .poll-num { border-radius: 0; }

  /* ==================== variety ==================== */
  body[data-theme="variety"] .poll-card {
    background: #fffdf7;
    color: #182033;
    border: 3.5px solid #182033;
    border-radius: 14px;
    box-shadow: 6px 6px 0 #182033;
  }
  body[data-theme="variety"] .poll-header { border-bottom: 2px solid #182033; }
  body[data-theme="variety"] .poll-status { background: #e5484d; border-radius: 6px; }
  body[data-theme="variety"] .poll-total { color: #3b465e; }
  body[data-theme="variety"] .poll-opt {
    background: #f5f2e9;
    border: 2px solid #182033;
    border-radius: 8px;
  }
  body[data-theme="variety"] .poll-footer {
    border-top: 2px dashed #c8c1b4;
    color: #3b465e;
  }
  body[data-theme="variety"] .poll-footer-badge {
    background: #f5c518;
    color: #182033;
    border-radius: 5px;
  }

  /* ==================== cinema ==================== */
  body[data-theme="cinema"] .poll-card {
    background: rgba(12, 14, 18, 0.42);
    border: none;
    border-left: 3.5px solid var(--accent, #f5c518);
    border-radius: 0;
    box-shadow: none;
  }
  body[data-theme="cinema"] .poll-question,
  body[data-theme="cinema"] .poll-label,
  body[data-theme="cinema"] .poll-stats {
    paint-order: stroke fill;
    -webkit-text-stroke: 3px rgba(10, 12, 16, 0.92);
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
  }

  /* ==================== edge_glow (エッジ・グロウ) ==================== */
  body[data-theme="edge_glow"] .poll-card {
    background: rgba(9, 13, 22, 0.8);
    color: #f8fafc;
    border: 1px solid rgba(148, 163, 184, 0.24);
    border-top: 3px solid var(--accent, #38bdf8);
    border-radius: 6px;
    box-shadow: 0 10px 26px rgba(2, 6, 23, 0.54), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  body[data-theme="edge_glow"] .poll-question {
    color: #ffffff;
    paint-order: stroke fill;
    -webkit-text-stroke: 1.5px rgba(8, 13, 24, 0.9);
    text-shadow:
      1px 0 2px rgba(56, 189, 248, 0.8),
      -1px 0 2px rgba(56, 189, 248, 0.8),
      0 1px 2px rgba(56, 189, 248, 0.8),
      0 -1px 2px rgba(56, 189, 248, 0.8),
      0 0 10px rgba(56, 189, 248, 0.58),
      0 0 20px rgba(56, 189, 248, 0.34);
  }
  body[data-theme="edge_glow"] .poll-label,
  body[data-theme="edge_glow"] .poll-stats {
    color: #f1f5f9;
    text-shadow:
      1px 0 2px rgba(56, 189, 248, 0.65),
      -1px 0 2px rgba(56, 189, 248, 0.65),
      0 0 7px rgba(56, 189, 248, 0.45);
  }
  body[data-theme="edge_glow"] .poll-opt.leader {
    border-color: rgba(125, 211, 252, 0.65);
    box-shadow: inset 0 0 12px rgba(56, 189, 248, 0.16);
  }

  body.has-custom-font,
  body.has-custom-font * {
    font-family: var(--font-family) !important;
  }
</style>
<style id="stosup-custom-css"></style>
</head>
<body data-theme="broadcast">
  <div id="wrap"></div>
<script>
  const wrap = document.getElementById('wrap');
  const customStyleEl = document.getElementById('stosup-custom-css');
  const params = new URLSearchParams(location.search);
  const urlTheme = params.get('theme');
  const urlBg = params.get('bg');
  const urlFont = params.get('font');

  let enabled = true;
  let poll = null;
  let config = {
    poll_theme: 'broadcast',
    poll_bg_color: 'transparent',
    poll_font_family: '',
    poll_custom_css: '',
    visual_styles: {}
  };
  let domState = null;
  let bumpTimer = null;

  function applyDesign() {
    document.body.dataset.theme = StosupOverlay.normalizeTheme(urlTheme || config.poll_theme);
    document.documentElement.style.setProperty('--page-bg', StosupOverlay.resolveBg(urlBg || config.poll_bg_color));
    StosupOverlay.applyFont(urlFont || config.poll_font_family);
    StosupOverlay.applyOverlayVisualStyle('poll', config, {
      card: '.poll-card',
      text: '.poll-label, .poll-question',
      author: '.poll-question',
      animate: '.poll-card'
    });
    StosupOverlay.applyCustomCss(customStyleEl, config.poll_custom_css);
  }

  function buildOptionGuide(opts) {
    return opts.map((opt, idx) => {
      const kws = (opt.keywords && opt.keywords.length) ? opt.keywords : [String(idx + 1)];
      return `「${kws[0]}」${opt.label}`;
    }).join(' / ');
  }

  function render() {
    if (!enabled || !poll || !poll.config || !poll.config.options || poll.config.options.length === 0) {
      if (bumpTimer) { clearTimeout(bumpTimer); bumpTimer = null; }
      wrap.innerHTML = '';
      domState = null;
      return;
    }
    const opts = poll.config.options;
    const total = Number(poll.total_votes || 0);
    const maxVote = opts.reduce((m, o) => Math.max(m, Number(o.vote_count || 0)), 0);
    const sig = opts.map(o => `${o.id}|${o.label}|${o.color}`).join('||') + '::' + (poll.config.question || '');

    if (!domState || domState.sig !== sig) {
      if (bumpTimer) { clearTimeout(bumpTimer); bumpTimer = null; }
      wrap.innerHTML = '';
      const card = document.createElement('div');
      card.className = 'poll-card';

      const header = document.createElement('div');
      header.className = 'poll-header';
      const statusEl = document.createElement('span');
      statusEl.className = 'poll-status';
      const qEl = document.createElement('div');
      qEl.className = 'poll-question';
      qEl.textContent = poll.config.question || 'ライブアンケート';
      const totalEl = document.createElement('div');
      totalEl.className = 'poll-total';
      header.appendChild(statusEl);
      header.appendChild(qEl);
      header.appendChild(totalEl);

      const list = document.createElement('div');
      list.className = 'poll-options';
      const rows = [];
      opts.forEach((opt, idx) => {
        const row = document.createElement('div');
        row.className = 'poll-opt';
        row.style.setProperty('--opt-color', opt.color || '#d93829');

        const bar = document.createElement('div');
        bar.className = 'poll-bar';
        row.appendChild(bar);

        const inner = document.createElement('div');
        inner.className = 'poll-opt-row';
        const num = document.createElement('div');
        num.className = 'poll-num';
        num.textContent = String(idx + 1);
        const label = document.createElement('div');
        label.className = 'poll-label';
        label.textContent = opt.label;
        const stats = document.createElement('div');
        stats.className = 'poll-stats';
        inner.appendChild(num);
        inner.appendChild(label);
        inner.appendChild(stats);
        row.appendChild(inner);
        list.appendChild(row);
        rows.push({ row, bar, stats });
      });

      const footer = document.createElement('div');
      footer.className = 'poll-footer';
      const fBadge = document.createElement('span');
      fBadge.className = 'poll-footer-badge';
      fBadge.textContent = 'VOTE';
      const fText = document.createElement('span');
      fText.textContent = 'コメントで投票: ' + buildOptionGuide(opts);
      footer.appendChild(fBadge);
      footer.appendChild(fText);

      card.appendChild(header);
      card.appendChild(list);
      card.appendChild(footer);
      wrap.appendChild(card);
      domState = { sig, statusEl, totalEl, rows, lastTotal: -1 };
    }

    domState.statusEl.className = 'poll-status' + (poll.is_active ? '' : ' closed');
    domState.statusEl.textContent = poll.is_active ? 'LIVE 受付中' : '受付終了';
    domState.totalEl.textContent = `計 ${total} 票`;
    if (domState.lastTotal !== total && domState.lastTotal >= 0) {
      const targetTotalEl = domState.totalEl;
      targetTotalEl.classList.remove('bump');
      void targetTotalEl.offsetWidth;
      targetTotalEl.classList.add('bump');
      if (bumpTimer) clearTimeout(bumpTimer);
      bumpTimer = setTimeout(() => {
        targetTotalEl.classList.remove('bump');
        bumpTimer = null;
      }, 220);
    }
    domState.lastTotal = total;

    opts.forEach((opt, idx) => {
      const r = domState.rows[idx];
      if (!r) return;
      const cnt = Number(opt.vote_count || 0);
      const pct = total > 0 ? Math.round((cnt / total) * 100) : 0;
      r.bar.style.transform = `scaleX(${pct / 100})`;
      r.row.classList.toggle('leader', maxVote > 0 && cnt === maxVote);
      const parts = [];
      if (poll.config.show_percentage) parts.push(`${pct}%`);
      if (poll.config.show_vote_count) parts.push(`${cnt}票`);
      r.stats.textContent = parts.join(' / ');
    });
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(window.StosupOverlay.buildWsUrl('poll'));
    ws.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.type === 'snapshot') {
          if (data.mods) window.StosupOverlay.syncMods(data.mods, data.mods_revision);
          config = Object.assign(config, data.config || {});
          poll = data.poll_state || null;
          if (typeof data.poll_enabled === 'boolean') enabled = data.poll_enabled;
          applyDesign();
          render();
        } else if (data.type === 'mods_updated') {
          window.StosupOverlay.syncMods(data.mods, data.revision);
          applyDesign();
        } else if (data.type === 'poll') {
          poll = data.poll || null;
          if (typeof data.enabled === 'boolean') enabled = data.enabled;
          render();
        } else if (data.type === 'clear_poll') {
          poll = null;
          render();
        } else if (data.type === 'config_updated') {
          config = Object.assign(config, data.config || {});
          applyDesign();
        }
      } catch (e) { console.error(e); }
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }
  applyDesign();
  connect();
</script>
</body>
</html>
