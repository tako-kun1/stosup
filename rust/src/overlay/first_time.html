<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stosup ウェルカムカウンター</title>
<link rel="icon" href="/favicon.ico" />
<script src="/overlay/stosup-overlay.js"></script>
<style id="stosup-base-css">
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--page-bg, transparent) !important;
    overflow: hidden;
    font-family: var(--font-family, "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif);
    -webkit-font-smoothing: antialiased;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding: 14px;
  }

  /* ==================== 既定: broadcast (オンエア小窓) ==================== */
  .ft-card {
    background: rgba(17, 19, 23, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-left: 5px solid var(--accent, #22a06b);
    border-radius: 2px;
    padding: 11px 20px 12px;
    min-width: 220px;
    color: #f7f8fa;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.36);
    contain: layout style;
  }
  .ft-title {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: #b4bac6;
    margin-bottom: 3px;
  }
  .ft-count {
    font-size: 44px;
    font-weight: 900;
    line-height: 1.05;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    transition: transform 0.16s ease, color 0.16s ease;
  }
  .ft-count.bump { transform: scale(1.14); color: var(--accent, #22a06b); }
  .ft-profiles {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    max-width: 340px;
  }
  .ft-user {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(17, 19, 23, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-left: 4px solid var(--accent, #22a06b);
    border-radius: 2px;
    padding: 7px 12px;
    color: #f7f8fa;
    contain: layout style;
    animation: fadeSlide 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateX(-12px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .ft-avatar {
    width: 32px;
    height: 32px;
    border-radius: 3px;
    object-fit: cover;
    border: 1.5px solid var(--accent, #22a06b);
    background: #1f232b;
  }
  .ft-user-name {
    font-size: 14px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ft-user-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 2px;
    background: var(--accent, #22a06b);
    color: #ffffff;
    font-weight: 800;
    margin-left: auto;
    flex-shrink: 0;
  }

  /* ==================== editorial ==================== */
  body[data-theme="editorial"] .ft-card,
  body[data-theme="editorial"] .ft-user {
    background: rgba(248, 245, 239, 0.97);
    color: #1c1b18;
    border: 1px solid #d4cdc0;
    border-left: 4px solid var(--accent, #1d6f42);
    box-shadow: 0 4px 14px rgba(28, 27, 24, 0.1);
  }
  body[data-theme="editorial"] .ft-title { color: #5c574f; }
  body[data-theme="editorial"] .ft-count { color: #1c1b18; }
  body[data-theme="editorial"] .ft-avatar { border-radius: 50%; }

  /* ==================== tactical ==================== */
  body[data-theme="tactical"] .ft-card,
  body[data-theme="tactical"] .ft-user {
    background: rgba(18, 20, 23, 0.95);
    color: #edebe4;
    border: 1px solid rgba(237, 235, 228, 0.22);
    border-top: 3px solid var(--accent, #e5a93b);
    border-left: 1px solid rgba(237, 235, 228, 0.22);
    border-radius: 0;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    box-shadow: none;
  }
  body[data-theme="tactical"] .ft-count {
    font-family: "Consolas", monospace;
    color: var(--accent, #e5a93b);
    font-size: 48px;
  }

  /* ==================== variety ==================== */
  body[data-theme="variety"] .ft-card,
  body[data-theme="variety"] .ft-user {
    background: #fffdf7;
    color: #182033;
    border: 3px solid #182033;
    border-radius: 12px;
    box-shadow: 5px 5px 0 #182033;
  }
  body[data-theme="variety"] .ft-title { color: #182033; }
  body[data-theme="variety"] .ft-count { color: #182033; }

  /* ==================== cinema ==================== */
  body[data-theme="cinema"] .ft-card,
  body[data-theme="cinema"] .ft-user {
    background: transparent;
    border: none;
    border-left: 3.5px solid var(--accent, #34d399);
    padding: 4px 12px;
    box-shadow: none;
  }
  body[data-theme="cinema"] .ft-title,
  body[data-theme="cinema"] .ft-count,
  body[data-theme="cinema"] .ft-user-name {
    color: #ffffff;
    paint-order: stroke fill;
    -webkit-text-stroke: 3.5px rgba(10, 12, 16, 0.94);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
  }

  /* ==================== edge_glow (エッジ・グロウ) ==================== */
  body[data-theme="edge_glow"] .ft-card,
  body[data-theme="edge_glow"] .ft-user {
    background: rgba(9, 13, 22, 0.78);
    color: #f8fafc;
    border: 1px solid rgba(148, 163, 184, 0.24);
    border-left: 3px solid var(--accent, #38bdf8);
    border-radius: 5px;
    box-shadow: 0 8px 22px rgba(2, 6, 23, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  body[data-theme="edge_glow"] .ft-title,
  body[data-theme="edge_glow"] .ft-user-name {
    color: #e0f2fe;
    text-shadow:
      1px 0 2px rgba(56, 189, 248, 0.72),
      -1px 0 2px rgba(56, 189, 248, 0.72),
      0 1px 2px rgba(56, 189, 248, 0.72),
      0 -1px 2px rgba(56, 189, 248, 0.72),
      0 0 8px rgba(56, 189, 248, 0.52);
  }
  body[data-theme="edge_glow"] .ft-count {
    color: #f8fafc;
    paint-order: stroke fill;
    -webkit-text-stroke: 2px rgba(8, 13, 24, 0.88);
    text-shadow:
      2px 0 3px rgba(56, 189, 248, 0.8),
      -2px 0 3px rgba(56, 189, 248, 0.8),
      0 2px 3px rgba(56, 189, 248, 0.8),
      0 -2px 3px rgba(56, 189, 248, 0.8),
      0 0 12px rgba(56, 189, 248, 0.65),
      0 0 24px rgba(56, 189, 248, 0.38);
  }

  body.has-custom-font,
  body.has-custom-font * {
    font-family: var(--font-family) !important;
  }
</style>
<style id="stosup-custom-css"></style>
</head>
<body data-theme="broadcast">
  <div id="wrap"></div>
<script>
  const wrap = document.getElementById('wrap');
  const customStyleEl = document.getElementById('stosup-custom-css');
  const params = new URLSearchParams(location.search);
  const urlTheme = params.get('theme');
  const urlBg = params.get('bg');
  const urlFont = params.get('font');

  let prevCount = null;
  let ftState = null;
  let ftEnabled = true;
  let config = {
    first_time_theme: 'broadcast',
    first_time_bg_color: 'transparent',
    first_time_font_family: '',
    first_time_custom_css: '',
    visual_styles: {}
  };

  function applyDesign() {
    document.body.dataset.theme = StosupOverlay.normalizeTheme(urlTheme || config.first_time_theme);
    document.documentElement.style.setProperty('--page-bg', StosupOverlay.resolveBg(urlBg || config.first_time_bg_color));
    StosupOverlay.applyFont(urlFont || config.first_time_font_family);
    StosupOverlay.applyOverlayVisualStyle('first_time', config, {
      card: '.ft-card',
      text: '.ft-count, .ft-title',
      author: '.ft-title',
      animate: '.ft-card'
    });
    StosupOverlay.applyCustomCss(customStyleEl, config.first_time_custom_css);
  }

  let ftDom = null;
  let bumpTimer = null;
  let lastProfilesSig = '';

  function render() {
    if (!ftEnabled || !ftState) {
      if (bumpTimer) { clearTimeout(bumpTimer); bumpTimer = null; }
      wrap.innerHTML = '';
      ftDom = null;
      lastProfilesSig = '';
      return;
    }
    const accent = (ftState.config && ftState.config.accent_color) || '#22a06b';
    if (document.documentElement.style.getPropertyValue('--accent') !== accent) {
      document.documentElement.style.setProperty('--accent', accent);
    }

    // カード本体を再利用し、カウント更新時の DOM 全破棄・再アニメーションを防止しつつ bump を正確に発火
    if (!ftDom) {
      const card = document.createElement('div');
      card.className = 'ft-card';

      const title = document.createElement('div');
      title.className = 'ft-title';
      title.textContent = 'WELCOME — 本日の初見さん';

      const countEl = document.createElement('div');
      countEl.className = 'ft-count';

      card.appendChild(title);
      card.appendChild(countEl);
      wrap.appendChild(card);
      ftDom = { card, countEl, profilesEl: null };
    }

    const nextCountText = String(ftState.count || 0);
    if (ftDom.countEl.textContent !== nextCountText) {
      ftDom.countEl.textContent = nextCountText;
    }
    if (prevCount !== null && prevCount !== ftState.count) {
      ftDom.countEl.classList.remove('bump');
      void ftDom.countEl.offsetWidth;
      ftDom.countEl.classList.add('bump');
      if (bumpTimer) clearTimeout(bumpTimer);
      bumpTimer = setTimeout(() => {
        if (ftDom) ftDom.countEl.classList.remove('bump');
        bumpTimer = null;
      }, 220);
    }
    prevCount = ftState.count;

    const showProfiles = !!(
      ftState.config &&
      ftState.config.show_first_timer_profile &&
      ftState.recent_users &&
      ftState.recent_users.length > 0
    );
    if (showProfiles) {
      const topUsers = ftState.recent_users.slice(0, 3);
      const sig = topUsers
        .map(u => `${u.user_id || ''}|${u.user_name || ''}|${u.user_icon_url || ''}`)
        .join('||');
      if (sig !== lastProfilesSig || !ftDom.profilesEl) {
        lastProfilesSig = sig;
        if (ftDom.profilesEl) ftDom.profilesEl.remove();
        const profiles = document.createElement('div');
        profiles.className = 'ft-profiles';
        const frag = document.createDocumentFragment();
        for (const u of topUsers) {
          const row = document.createElement('div');
          row.className = 'ft-user';
          const img = document.createElement('img');
          img.className = 'ft-avatar';
          img.src = u.user_icon_url || StosupOverlay.fallbackAvatar(u.user_name);
          img.onerror = () => { img.src = StosupOverlay.fallbackAvatar(u.user_name); };
          const name = document.createElement('div');
          name.className = 'ft-user-name';
          name.textContent = u.user_name;
          const badge = document.createElement('span');
          badge.className = 'ft-user-badge';
          badge.textContent = 'NEW';
          row.appendChild(img);
          row.appendChild(name);
          row.appendChild(badge);
          frag.appendChild(row);
        }
        profiles.appendChild(frag);
        wrap.appendChild(profiles);
        ftDom.profilesEl = profiles;
      }
    } else if (ftDom.profilesEl) {
      ftDom.profilesEl.remove();
      ftDom.profilesEl = null;
      lastProfilesSig = '';
    }
  }

  function connect() {
    const ws = new WebSocket(window.StosupOverlay.buildWsUrl('first_time'));
    ws.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.type === 'snapshot') {
          if (data.mods && typeof window.StosupOverlay.syncMods === 'function') window.StosupOverlay.syncMods(data.mods, data.mods_revision);
          config = Object.assign(config, data.config || {});
          ftState = data.first_time || null;
          if (typeof data.first_time_enabled === 'boolean') ftEnabled = data.first_time_enabled;
          applyDesign();
          render();
        } else if (data.type === 'mods_updated') {
          if (typeof window.StosupOverlay.syncMods === 'function') window.StosupOverlay.syncMods(data.mods, data.revision);
          applyDesign();
        } else if (data.type === 'first_time') {
          ftState = data.first_time || null;
          if (typeof data.enabled === 'boolean') ftEnabled = data.enabled;
          render();
        } else if (data.type === 'config_updated') {
          config = Object.assign(config, data.config || {});
          applyDesign();
        }
      } catch (e) { console.error(e); }
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }

  applyDesign();
  connect();
</script>
</body>
</html>
