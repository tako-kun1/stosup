<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stosup 抽選オーバーレイ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent !important;
    overflow: hidden;
    font-family: "Yu Gothic UI", "Meiryo", "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    width: 100%;
    max-width: 960px;
    padding: 24px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  #stage.visible { display: flex; }
  .banner {
    background: linear-gradient(135deg, #6366f1, #ec4899);
    color: #fff;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.08em;
    padding: 10px 32px;
    border-radius: 999px;
    box-shadow: 0 8px 28px rgba(236, 72, 153, 0.45);
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .winners-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    width: 100%;
  }
  .winner-card {
    background: rgba(15, 23, 42, 0.92);
    border: 2px solid #facc15;
    border-radius: 22px;
    padding: 24px 32px;
    min-width: 280px;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 12px;
    color: #f8fafc;
    box-shadow: 0 0 36px rgba(250, 204, 21, 0.35), 0 12px 32px rgba(0, 0, 0, 0.5);
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .winner-avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #facc15;
    box-shadow: 0 4px 18px rgba(250, 204, 21, 0.4);
    background: #334155;
  }
  .winner-name {
    font-size: 28px;
    font-weight: 800;
    color: #fef08a;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    word-break: break-word;
  }
  .winner-comment {
    background: rgba(255, 255, 255, 0.09);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 16px;
    color: #e2e8f0;
    line-height: 1.45;
    width: 100%;
    word-break: break-word;
  }
  .rolling {
    background: rgba(15, 23, 42, 0.92);
    border: 2px solid #38bdf8;
    border-radius: 20px;
    padding: 28px 48px;
    color: #38bdf8;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.1em;
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.35);
    animation: pulse 0.45s infinite alternate;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.75) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes pulse {
    from { transform: scale(0.97); opacity: 0.85; }
    to   { transform: scale(1.03); opacity: 1; }
  }
</style>
</head>
<body>
  <div id="stage"></div>
<script>
  const stage = document.getElementById('stage');
  let rollingTimer = null;

  function fallbackAvatar(name) {
    const ch = (name || '?').slice(0, 1);
    return `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='32' fill='%236366f1'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold' font-size='28'>${encodeURIComponent(ch)}</text></svg>`;
  }

  function renderResult(result, animate) {
    if (rollingTimer) { clearTimeout(rollingTimer); rollingTimer = null; }
    if (!result || !result.winners || result.winners.length === 0) {
      stage.className = '';
      stage.innerHTML = '';
      return;
    }

    const showFinal = () => {
      stage.innerHTML = '';
      stage.className = 'visible';

      const banner = document.createElement('div');
      banner.className = 'banner';
      banner.textContent = result.kind === 'comment' ? 'コメント抽選 当選者発表！' : '抽選結果 当選者発表！';
      stage.appendChild(banner);

      const grid = document.createElement('div');
      grid.className = 'winners-grid';

      result.winners.forEach((w) => {
        const card = document.createElement('div');
        card.className = 'winner-card';

        const img = document.createElement('img');
        img.className = 'winner-avatar';
        img.src = w.user_icon_url || fallbackAvatar(w.user_name);
        img.onerror = () => { img.src = fallbackAvatar(w.user_name); };
        card.appendChild(img);

        const name = document.createElement('div');
        name.className = 'winner-name';
        name.textContent = w.user_name;
        card.appendChild(name);

        if (w.comment_text) {
          const cm = document.createElement('div');
          cm.className = 'winner-comment';
          cm.textContent = w.comment_text;
          card.appendChild(cm);
        }

        grid.appendChild(card);
      });

      stage.appendChild(grid);
    };

    if (animate) {
      stage.className = 'visible';
      stage.innerHTML = '<div class="rolling">抽選中...</div>';
      rollingTimer = setTimeout(showFinal, 1100);
    } else {
      showFinal();
    }
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.type === 'snapshot') {
          renderResult(data.last_lottery, false);
        } else if (data.type === 'lottery_result') {
          renderResult(data.result, true);
        } else if (data.type === 'clear_lottery') {
          renderResult(null, false);
        }
      } catch (e) { console.error(e); }
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }
  connect();
</script>
</body>
</html>
