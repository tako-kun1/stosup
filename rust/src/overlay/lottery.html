<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stosup 抽選オーバーレイ</title>
<link rel="icon" href="/favicon.ico" />
<style id="stosup-base-css">
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent !important;
    overflow: hidden;
    font-family: "Yu Gothic UI", "Meiryo", "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    width: 100%;
    max-width: 960px;
    padding: 24px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  #stage.visible { display: flex; }
  .banner {
    background: #27272a;
    color: #fafafa;
    border: 1.5px solid #eab308;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.06em;
    padding: 8px 28px;
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .winners-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 18px;
    width: 100%;
  }
  .winner-card {
    background: rgba(24, 24, 27, 0.94);
    border: 2px solid #eab308;
    border-radius: 12px;
    padding: 22px 30px;
    min-width: 280px;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 12px;
    color: #f4f4f5;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .winner-avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #eab308;
    background: #3f3f46;
  }
  .winner-name {
    font-size: 26px;
    font-weight: 800;
    color: #fde047;
    word-break: break-word;
  }
  .winner-comment {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 15px;
    color: #e4e4e7;
    line-height: 1.45;
    width: 100%;
    word-break: break-word;
  }
  .rolling {
    background: rgba(24, 24, 27, 0.94);
    border: 2px solid #3b82f6;
    border-radius: 10px;
    padding: 24px 44px;
    color: #93c5fd;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.1em;
    animation: pulse 0.45s infinite alternate;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.82) translateY(16px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes pulse {
    from { transform: scale(0.97); opacity: 0.85; }
    to   { transform: scale(1.03); opacity: 1; }
  }

  /* プリセット: festive (お祭り・派手演出) */
  body[data-theme="festive"] .banner {
    background: linear-gradient(135deg, #dc2626, #f59e0b);
    border: 2px solid #fef08a;
    border-radius: 999px;
    font-size: 24px;
    box-shadow: 0 8px 28px rgba(220, 38, 38, 0.45);
  }
  body[data-theme="festive"] .winner-card {
    background: linear-gradient(160deg, rgba(127, 29, 29, 0.95), rgba(39, 24, 15, 0.95));
    border: 3px solid #facc15;
    border-radius: 20px;
    box-shadow: 0 0 36px rgba(250, 204, 21, 0.4), 0 12px 32px rgba(0, 0, 0, 0.5);
  }

  /* プリセット: minimal (シンプル・下部テロップ) */
  body[data-theme="minimal"] { align-items: flex-end; }
  body[data-theme="minimal"] #stage { gap: 10px; padding-bottom: 20px; }
  body[data-theme="minimal"] .banner {
    font-size: 14px;
    padding: 4px 14px;
    border: none;
    background: rgba(24, 24, 27, 0.86);
    border-left: 4px solid #3b82f6;
    border-radius: 4px;
  }
  body[data-theme="minimal"] .winner-card {
    flex-direction: row;
    text-align: left;
    padding: 12px 20px;
    min-width: 320px;
    max-width: 640px;
    border-width: 1px;
    border-color: rgba(255, 255, 255, 0.25);
    border-radius: 8px;
  }
  body[data-theme="minimal"] .winner-avatar { width: 52px; height: 52px; border-width: 2px; }
  body[data-theme="minimal"] .winner-name { font-size: 20px; color: #ffffff; }

  /* プリセット: neon (サイバー・ステージ) */
  body[data-theme="neon"] .banner {
    background: rgba(9, 11, 20, 0.94);
    border: 2px solid #22d3ee;
    color: #67e8f9;
    box-shadow: 0 0 22px rgba(34, 211, 238, 0.4);
  }
  body[data-theme="neon"] .winner-card {
    background: rgba(9, 11, 20, 0.94);
    border: 2px solid #e879f9;
    border-radius: 6px;
    box-shadow: 0 0 28px rgba(232, 121, 249, 0.35);
  }
  body[data-theme="neon"] .winner-avatar { border-color: #22d3ee; }
  body[data-theme="neon"] .winner-name { color: #f0abfc; }

  /* プリセット: cute (パステル・ふんわり) */
  body[data-theme="cute"] .banner {
    background: #fbcfe8;
    color: #831843;
    border: 2px solid #f472b6;
    border-radius: 999px;
  }
  body[data-theme="cute"] .winner-card {
    background: rgba(255, 251, 245, 0.96);
    color: #3f3f46;
    border: 3px solid #f9a8d4;
    border-radius: 26px;
    box-shadow: 0 10px 26px rgba(244, 114, 182, 0.28);
  }
  body[data-theme="cute"] .winner-avatar { border-color: #f472b6; }
  body[data-theme="cute"] .winner-name { color: #db2777; }
  body[data-theme="cute"] .winner-comment { background: #fdf2f8; color: #52525b; }
</style>
<style id="stosup-custom-css"></style>
</head>
<body data-theme="default">
  <div id="stage"></div>
<script>
  const stage = document.getElementById('stage');
  const customStyleEl = document.getElementById('stosup-custom-css');
  const urlThemeOverride = new URLSearchParams(location.search).get('theme');
  let rollingTimer = null;
  let config = { lottery_theme: 'default', lottery_custom_css: '' };

  function applyDesign() {
    document.body.dataset.theme = urlThemeOverride || config.lottery_theme || 'default';
    customStyleEl.textContent = config.lottery_custom_css || '';
  }

  function fallbackAvatar(name) {
    const ch = (name || '?').slice(0, 1);
    return `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='32' fill='%2352525b'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold' font-size='28'>${encodeURIComponent(ch)}</text></svg>`;
  }

  function renderResult(result, animate) {
    if (rollingTimer) { clearTimeout(rollingTimer); rollingTimer = null; }
    if (!result || !result.winners || result.winners.length === 0) {
      stage.className = '';
      stage.innerHTML = '';
      return;
    }

    const showFinal = () => {
      stage.innerHTML = '';
      stage.className = 'visible';

      const banner = document.createElement('div');
      banner.className = 'banner';
      banner.textContent = result.kind === 'comment' ? 'コメント抽選 当選者発表！' : '抽選結果 当選者発表！';
      stage.appendChild(banner);

      const grid = document.createElement('div');
      grid.className = 'winners-grid';

      result.winners.forEach((w) => {
        const card = document.createElement('div');
        card.className = 'winner-card';

        const img = document.createElement('img');
        img.className = 'winner-avatar';
        img.src = w.user_icon_url || fallbackAvatar(w.user_name);
        img.onerror = () => { img.src = fallbackAvatar(w.user_name); };
        card.appendChild(img);

        const bodyWrap = document.createElement('div');
        bodyWrap.className = 'winner-info';
        const name = document.createElement('div');
        name.className = 'winner-name';
        name.textContent = w.user_name;
        bodyWrap.appendChild(name);

        if (w.comment_text) {
          const cm = document.createElement('div');
          cm.className = 'winner-comment';
          cm.textContent = w.comment_text;
          bodyWrap.appendChild(cm);
        }
        card.appendChild(bodyWrap);
        grid.appendChild(card);
      });

      stage.appendChild(grid);
    };

    if (animate) {
      stage.className = 'visible';
      stage.innerHTML = '<div class="rolling">抽選中...</div>';
      rollingTimer = setTimeout(showFinal, 1000);
    } else {
      showFinal();
    }
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.type === 'snapshot') {
          config = Object.assign(config, data.config || {});
          applyDesign();
          renderResult(data.last_lottery, false);
        } else if (data.type === 'lottery_result') {
          renderResult(data.result, true);
        } else if (data.type === 'clear_lottery') {
          renderResult(null, false);
        } else if (data.type === 'config_updated') {
          config = Object.assign(config, data.config || {});
          applyDesign();
        }
      } catch (e) { console.error(e); }
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }
  applyDesign();
  connect();
</script>
</body>
</html>
