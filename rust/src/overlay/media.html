<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stosup WordParty 演出オーバーレイ</title>
<link rel="icon" href="/favicon.ico" />
<style id="stosup-base-css">
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--page-bg, transparent) !important;
    transition: background-color 0.2s ease;
    overflow: hidden;
    font-family: var(--font-family, "Yu Gothic UI", "Meiryo", "Segoe UI", sans-serif);
  }
  #fx-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 10;
    will-change: transform;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    pointer-events: none;
    z-index: 20;
    contain: layout style size;
  }
  .media-slot {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    pointer-events: none;
    will-change: opacity, transform;
    contain: layout style;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .media-slot.pos-center {
    left: 50%; top: 50%; transform: translate3d(-50%, -50%, 0);
  }
  .media-slot.pos-top_left { left: 28px; top: 28px; align-items: flex-start; }
  .media-slot.pos-top_right { right: 28px; top: 28px; align-items: flex-end; }
  .media-slot.pos-bottom_left { left: 28px; bottom: 28px; align-items: flex-start; }
  .media-slot.pos-bottom_right { right: 28px; bottom: 28px; align-items: flex-end; }
  .media-slot.pos-full_screen {
    inset: 0;
    justify-content: center;
    align-items: center;
    width: 100% !important;
    height: 100% !important;
  }
  .media-slot.leaving { opacity: 0 !important; }
  .media-frame {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    max-width: 100%;
    max-height: 100%;
    will-change: opacity, transform;
  }
  .media-el {
    display: block;
    max-width: 100%;
    max-height: 82vh;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.42);
  }
  .media-slot.pos-full_screen .media-el {
    width: 100%;
    height: 100%;
    max-height: 100vh;
    object-fit: contain;
    border-radius: 0;
    box-shadow: none;
  }
  .media-caption {
    padding: 8px 20px;
    border-radius: 999px;
    background: rgba(24, 24, 27, 0.9);
    border: 1.5px solid rgba(255, 255, 255, 0.25);
    color: #f4f4f5;
    font-size: 22px;
    font-weight: 800;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    text-align: center;
    white-space: pre-wrap;
  }

  /* 登場アニメーション（GPU コンポジットプロパティのみ使用） */
  .anim-fade .media-frame { animation: animFade 0.32s ease forwards; }
  .anim-pop_in .media-frame { animation: animPopIn 0.36s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .anim-slide_up .media-frame { animation: animSlideUp 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .anim-slide_left .media-frame { animation: animSlideLeft 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .anim-bounce .media-frame { animation: animBounce 0.62s ease forwards; }
  .anim-zoom_spin .media-frame { animation: animZoomSpin 0.46s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

  @keyframes animFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes animPopIn { from { opacity: 0; transform: scale3d(0.4, 0.4, 1); } to { opacity: 1; transform: scale3d(1, 1, 1); } }
  @keyframes animSlideUp { from { opacity: 0; transform: translate3d(0, 70px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
  @keyframes animSlideLeft { from { opacity: 0; transform: translate3d(90px, 0, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
  @keyframes animBounce {
    0% { opacity: 0; transform: translate3d(0, -60px, 0) scale3d(0.8, 0.8, 1); }
    45% { opacity: 1; transform: translate3d(0, 14px, 0) scale3d(1.04, 1.04, 1); }
    72% { transform: translate3d(0, -8px, 0) scale3d(0.98, 0.98, 1); }
    100% { opacity: 1; transform: translate3d(0, 0, 0) scale3d(1, 1, 1); }
  }
  @keyframes animZoomSpin {
    from { opacity: 0; transform: scale3d(0.2, 0.2, 1) rotate(-25deg); }
    to   { opacity: 1; transform: scale3d(1, 1, 1) rotate(0deg); }
  }

  /* プリセット */
  body[data-theme="minimal"] .media-el { border-radius: 4px; box-shadow: none; }
  body[data-theme="minimal"] .media-caption {
    background: rgba(15, 15, 18, 0.68);
    border: none;
    border-radius: 4px;
  }
  body[data-theme="pop"] .media-el {
    border: 4px solid #18181b;
    border-radius: 18px;
    box-shadow: 6px 6px 0 #18181b;
  }
  body[data-theme="pop"] .media-caption {
    background: #ffffff;
    color: #18181b;
    border: 3px solid #18181b;
    box-shadow: 4px 4px 0 #18181b;
    text-shadow: none;
  }
  body[data-theme="neon"] .media-el {
    border: 2px solid #22d3ee;
    box-shadow: 0 0 22px rgba(34, 211, 238, 0.5);
  }
  body[data-theme="neon"] .media-caption {
    background: rgba(9, 11, 20, 0.92);
    color: #ecfeff;
    border: 2px solid #22d3ee;
    box-shadow: 0 0 14px rgba(34, 211, 238, 0.38);
  }
  body[data-theme="pastel"] .media-el {
    border: 3px solid #f472b6;
    border-radius: 22px;
    box-shadow: 0 8px 20px rgba(244, 114, 182, 0.28);
  }
  body[data-theme="pastel"] .media-caption {
    background: rgba(255, 251, 245, 0.96);
    color: #db2777;
    border: 2.5px solid #f9a8d4;
    text-shadow: none;
  }

  body.has-custom-font,
  body.has-custom-font * {
    font-family: var(--font-family) !important;
  }
</style>
<style id="stosup-custom-css"></style>
</head>
<body data-theme="default">
  <canvas id="fx-canvas"></canvas>
  <div id="stage"></div>
<script>
  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const stage = document.getElementById('stage');
  const customStyleEl = document.getElementById('stosup-custom-css');
  const params = new URLSearchParams(location.search);
  const urlTheme = params.get('theme');
  const urlBg = params.get('bg');
  const urlFont = params.get('font');

  let enabled = true;
  let mediaConfig = { playback_mode: 'Overlay', master_volume: 80, max_concurrent: 8 };
  let config = {
    media_theme: 'default',
    media_bg_color: 'transparent',
    media_font_family: '',
    media_custom_css: ''
  };

  // ==================== Canvas リサイズ（1x 等倍で軽量・高 FPS 維持） ====================
  let vw = window.innerWidth;
  let vh = window.innerHeight;
  let canvasScale = 1;
  function resizeCanvas() {
    vw = Math.max(1, window.innerWidth);
    vh = Math.max(1, window.innerHeight);
    // 4K 画面でも内部解像度を抑えてフィルレート負荷を大幅に削減
    const maxDim = Math.max(vw, vh);
    canvasScale = maxDim > 1920 ? (1920 / maxDim) : 1;
    canvas.width = Math.max(1, Math.floor(vw * canvasScale));
    canvas.height = Math.max(1, Math.floor(vh * canvasScale));
    ctx.setTransform(canvasScale, 0, 0, canvasScale, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ==================== デザイン反映 ====================
  function applyFont(raw) {
    const f = (raw || '').trim();
    if (f) {
      const safe = f.replace(/["\\]/g, '');
      document.documentElement.style.setProperty('--font-family', `"${safe}", "Yu Gothic UI", "Meiryo", sans-serif`);
      document.body.classList.add('has-custom-font');
    } else {
      document.documentElement.style.removeProperty('--font-family');
      document.body.classList.remove('has-custom-font');
    }
  }
  function resolveBg(raw) {
    const v = (raw || 'transparent').trim();
    if (!v || v.toLowerCase() === 'transparent') return 'transparent';
    if (/^[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$/.test(v)) return '#' + v;
    if (/^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$/.test(v)) return v;
    return 'transparent';
  }
  function applyDesign() {
    document.body.dataset.theme = urlTheme || config.media_theme || 'default';
    document.documentElement.style.setProperty('--page-bg', resolveBg(urlBg || config.media_bg_color));
    applyFont(urlFont || config.media_font_family);
    customStyleEl.textContent = config.media_custom_css || '';
  }

  // ==================== オフスクリーン・スプライトキャッシュ ====================
  // テキスト・絵文字・発光シェイプ・大解像度画像を 1 回だけオフスクリーン Canvas へ
  // 事前レンダリングしてキャッシュし、毎フレームは GPU テクスチャ転送 (drawImage) のみにする。
  const MAX_SPRITE_CACHE = 96;
  const textSpriteCache = new Map();
  const shapeSpriteCache = new Map();
  const imageSpriteCache = new Map();
  const imageLoadingPromises = new Map();

  function getTextSprite(text) {
    const key = String(text || '');
    if (!key) return null;
    const cached = textSpriteCache.get(key);
    if (cached) return cached;

    if (textSpriteCache.size >= MAX_SPRITE_CACHE) {
      const firstKey = textSpriteCache.keys().next().value;
      textSpriteCache.delete(firstKey);
    }

    const fontPx = 88;
    const measureC = document.createElement('canvas');
    const mCtx = measureC.getContext('2d');
    const fontStr = `bold ${fontPx}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", "Yu Gothic UI", sans-serif`;
    mCtx.font = fontStr;
    const metrics = mCtx.measureText(key);
    const pad = 22;
    const w = Math.min(480, Math.max(fontPx + pad * 2, Math.ceil(metrics.width) + pad * 2));
    const h = fontPx + pad * 2;

    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const sc = c.getContext('2d');
    sc.font = fontStr;
    sc.textAlign = 'center';
    sc.textBaseline = 'middle';
    sc.lineJoin = 'round';
    sc.fillStyle = '#ffffff';
    sc.strokeStyle = 'rgba(0, 0, 0, 0.65)';
    sc.lineWidth = 7;
    sc.strokeText(key, w / 2, h / 2 + 2);
    sc.fillText(key, w / 2, h / 2 + 2);

    const sprite = { canvas: c, aspect: w / h, baseH: fontPx };
    textSpriteCache.set(key, sprite);
    return sprite;
  }

  function getShapeSprite(kind, color) {
    const key = `${kind}|${color}`;
    const cached = shapeSpriteCache.get(key);
    if (cached) return cached;

    const size = 64;
    const half = size / 2;
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const sc = c.getContext('2d');

    if (kind === 'snow') {
      const g = sc.createRadialGradient(half, half, 2, half, half, half);
      g.addColorStop(0, 'rgba(255, 255, 255, 1)');
      g.addColorStop(0.5, 'rgba(255, 255, 255, 0.85)');
      g.addColorStop(1, 'rgba(255, 255, 255, 0)');
      sc.fillStyle = g;
      sc.fillRect(0, 0, size, size);
    } else if (kind === 'glow') {
      const g = sc.createRadialGradient(half, half, 2, half, half, half);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.32, color);
      g.addColorStop(1, 'rgba(0, 0, 0, 0)');
      sc.fillStyle = g;
      sc.fillRect(0, 0, size, size);
    } else if (kind === 'star') {
      // shadowBlur を使わず放射状ハロー + 星形で軽量＆美しく発光
      const g = sc.createRadialGradient(half, half, 2, half, half, half);
      g.addColorStop(0, color);
      g.addColorStop(0.5, 'rgba(255, 255, 220, 0.25)');
      g.addColorStop(1, 'rgba(255, 255, 220, 0)');
      sc.fillStyle = g;
      sc.fillRect(0, 0, size, size);
      sc.save();
      sc.translate(half, half);
      sc.fillStyle = color;
      sc.beginPath();
      const r = half * 0.72;
      for (let i = 0; i < 8; i++) {
        const rad = i % 2 === 0 ? r : r * 0.3;
        const a = (i * Math.PI) / 4;
        if (i === 0) sc.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
        else sc.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
      }
      sc.closePath();
      sc.fill();
      sc.restore();
    } else if (kind === 'petal') {
      sc.fillStyle = color;
      sc.beginPath();
      sc.ellipse(half, half, half * 0.85, half * 0.5, 0, 0, Math.PI * 2);
      sc.fill();
    } else if (kind === 'confetti') {
      sc.fillStyle = color;
      sc.fillRect(4, 14, size - 8, size - 28);
    }

    const sprite = { canvas: c, aspect: 1 };
    shapeSpriteCache.set(key, sprite);
    return sprite;
  }

  function loadSpriteImage(url) {
    if (!url) return Promise.resolve(null);
    if (imageSpriteCache.has(url)) {
      return Promise.resolve(imageSpriteCache.get(url));
    }
    if (imageLoadingPromises.has(url)) {
      return imageLoadingPromises.get(url);
    }
    const p = new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        // 大解像度画像をパーティクル用の軽量サイズ（最大 256px）へ縮小キャッシュ
        const nw = Math.max(1, img.naturalWidth);
        const nh = Math.max(1, img.naturalHeight);
        const maxEdge = 256;
        let tw = nw;
        let th = nh;
        if (nw > maxEdge || nh > maxEdge) {
          const scale = maxEdge / Math.max(nw, nh);
          tw = Math.max(1, Math.round(nw * scale));
          th = Math.max(1, Math.round(nh * scale));
        }
        const c = document.createElement('canvas');
        c.width = tw;
        c.height = th;
        const sc = c.getContext('2d');
        sc.imageSmoothingEnabled = true;
        sc.imageSmoothingQuality = 'high';
        sc.drawImage(img, 0, 0, tw, th);

        if (imageSpriteCache.size >= 48) {
          const firstKey = imageSpriteCache.keys().next().value;
          imageSpriteCache.delete(firstKey);
        }
        const sprite = { canvas: c, aspect: nw / nh };
        imageSpriteCache.set(url, sprite);
        imageLoadingPromises.delete(url);
        resolve(sprite);
      };
      img.onerror = () => {
        imageLoadingPromises.delete(url);
        resolve(null);
      };
      img.src = url;
    });
    imageLoadingPromises.set(url, p);
    return p;
  }

  // ==================== Web Audio API 効果音キャッシュ（ゼロ遅延＆軽量） ====================
  let audioCtx = null;
  const audioBufferCache = new Map();
  const audioBufferLoading = new Map();
  const lastSoundPlayedAt = new Map();
  const activeAudioNodes = new Set();
  const activeFallbackAudios = new Set();
  const MAX_CONCURRENT_SOUNDS = 6;

  function getAudioContext() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) {
        try { audioCtx = new Ctx(); } catch (_) {}
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  async function loadAudioBuffer(url) {
    if (audioBufferCache.has(url)) return audioBufferCache.get(url);
    if (audioBufferLoading.has(url)) return audioBufferLoading.get(url);
    const ac = getAudioContext();
    if (!ac) return null;
    const p = fetch(url)
      .then((res) => (res.ok ? res.arrayBuffer() : null))
      .then((buf) => (buf ? ac.decodeAudioData(buf) : null))
      .then((decoded) => {
        if (decoded) {
          if (audioBufferCache.size >= 24) {
            const k = audioBufferCache.keys().next().value;
            audioBufferCache.delete(k);
          }
          audioBufferCache.set(url, decoded);
        }
        audioBufferLoading.delete(url);
        return decoded;
      })
      .catch(() => {
        audioBufferLoading.delete(url);
        return null;
      });
    audioBufferLoading.set(url, p);
    return p;
  }

  function playFallbackAudio(url, vol) {
    if (activeFallbackAudios.size >= MAX_CONCURRENT_SOUNDS) return;
    const audio = new Audio(url);
    audio.volume = vol;
    activeFallbackAudios.add(audio);
    const cleanup = () => activeFallbackAudios.delete(audio);
    audio.onended = cleanup;
    audio.onerror = cleanup;
    const p = audio.play();
    if (p && typeof p.catch === 'function') p.catch(cleanup);
  }

  function playAudioFile(url, ruleVol) {
    if (!url) return;
    const vol = Math.max(0, Math.min(1, ((ruleVol ?? 80) / 100) * ((mediaConfig.master_volume ?? 80) / 100)));
    if (vol <= 0) return;

    // 同一 SE の超高速連打によるデコード飽和を防止
    const now = performance.now();
    const last = lastSoundPlayedAt.get(url) || 0;
    if (now - last < 65) return;
    lastSoundPlayedAt.set(url, now);

    const ac = getAudioContext();
    if (!ac) {
      playFallbackAudio(url, vol);
      return;
    }

    loadAudioBuffer(url).then((buffer) => {
      if (!buffer) {
        playFallbackAudio(url, vol);
        return;
      }
      if (activeAudioNodes.size >= MAX_CONCURRENT_SOUNDS) {
        const oldest = activeAudioNodes.values().next().value;
        try { oldest.stop(); } catch (_) {}
        activeAudioNodes.delete(oldest);
      }
      try {
        const src = ac.createBufferSource();
        const gain = ac.createGain();
        src.buffer = buffer;
        gain.gain.value = vol;
        src.connect(gain);
        gain.connect(ac.destination);
        activeAudioNodes.add(src);
        src.onended = () => activeAudioNodes.delete(src);
        src.start(0);
      } catch (_) {
        playFallbackAudio(url, vol);
      }
    });
  }

  // ==================== 60fps 軽量物理パーティクルエンジン ====================
  const CONFETTI_COLORS = ['#f43f5e', '#f59e0b', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#a855f7', '#ec4899'];
  const SAKURA_COLORS = ['#fbcfe8', '#f9a8d4', '#f472b6', '#fce7f3'];
  const EMBER_COLORS = ['#fef08a', '#fb923c', '#f97316', '#ef4444'];
  const STAR_COLORS = ['#fef08a', '#fde047', '#ffffff', '#bae6fd'];

  const MAX_PARTICLES = 220;
  const MAX_AMBIENT_EMITTERS = 4;

  let particles = [];
  let rings = [];
  let ambientEmitters = [];
  let rafRunning = false;
  let lastFrameTs = 0;

  function rand(min, max) { return min + Math.random() * (max - min); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function parseTokens(raw, fallback) {
    const tokens = (raw || '').split(/[,、\n]/).map(s => s.trim()).filter(Boolean);
    return tokens.length > 0 ? tokens : fallback;
  }

  function pushParticle(p) {
    if (particles.length >= MAX_PARTICLES) {
      // 上限超過時は最古のパーティクルを上書きして GC と描画負荷を防止
      particles[Math.floor(Math.random() * Math.min(24, particles.length))] = p;
      return;
    }
    particles.push(p);
  }

  function ensureLoop() {
    if (rafRunning) return;
    rafRunning = true;
    lastFrameTs = performance.now();
    requestAnimationFrame(tick);
  }

  function spawnCracker(trigger, imgSprite) {
    const count = Math.max(4, Math.min(80, trigger.particle_count || 28));
    const speedScale = (trigger.particle_speed || 100) / 100;
    const gravScale = (trigger.gravity ?? 100) / 100;
    const baseSize = Math.max(20, Math.min(220, trigger.particle_size || 58));
    const tokens = parseTokens(trigger.particle_text, ['🎉', '🎊', '✨', '⭐']);
    const lifeSec = Math.max(1.8, (trigger.duration_ms || 3800) / 1000);

    for (let i = 0; i < count; i++) {
      const fromLeft = i % 2 === 0;
      const ox = fromLeft ? -10 : vw + 10;
      const oy = vh * rand(0.68, 0.94);
      const angle = fromLeft ? rand(-1.28, -0.35) : rand(-2.79, -1.86);
      const spd = rand(520, 1080) * speedScale;
      const useRibbon = !imgSprite && !trigger.particle_text && i % 3 !== 0;

      let sprite;
      let size = baseSize * rand(0.7, 1.25);
      if (imgSprite) {
        sprite = imgSprite;
      } else if (useRibbon) {
        sprite = getShapeSprite('confetti', pick(CONFETTI_COLORS));
        size = rand(18, 28);
      } else {
        sprite = getTextSprite(pick(tokens));
      }

      pushParticle({
        kind: useRibbon ? 'confetti' : 'sprite',
        sprite,
        color: '#ffffff',
        x: ox, y: oy,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        g: 760 * gravScale,
        dragRate: 0.84,
        size,
        rot: rand(0, Math.PI * 2),
        vrot: rand(-7, 7),
        flip: rand(0, Math.PI * 2),
        vflip: useRibbon ? rand(5, 10) : 0,
        swayAmp: rand(10, 35),
        swayFreq: rand(2, 5),
        phase: rand(0, Math.PI * 2),
        age: 0,
        maxAge: lifeSec * rand(0.75, 1.1),
        bounceY: null,
        bouncesLeft: 0
      });
    }
    ensureLoop();
  }

  function spawnDrop(trigger, imgSprite) {
    const count = Math.max(3, Math.min(80, trigger.particle_count || 22));
    const speedScale = (trigger.particle_speed || 100) / 100;
    const gravScale = (trigger.gravity ?? 100) / 100;
    const baseSize = Math.max(20, Math.min(220, trigger.particle_size || 64));
    const tokens = parseTokens(trigger.particle_text, ['✨', '⭐', '🌟']);
    const lifeSec = Math.max(2.2, (trigger.duration_ms || 4500) / 1000);

    for (let i = 0; i < count; i++) {
      const delay = rand(0, Math.min(1.4, lifeSec * 0.35));
      const sprite = imgSprite || getTextSprite(pick(tokens));
      pushParticle({
        kind: 'sprite',
        sprite,
        color: '#ffffff',
        x: rand(baseSize, Math.max(baseSize + 10, vw - baseSize)),
        y: -baseSize * rand(1.0, 2.2),
        vx: rand(-35, 35) * speedScale,
        vy: rand(130, 280) * speedScale,
        g: 240 * gravScale,
        dragRate: 0.24,
        size: baseSize * rand(0.75, 1.25),
        rot: rand(-0.6, 0.6),
        vrot: rand(-2.5, 2.5),
        flip: 0,
        vflip: 0,
        swayAmp: rand(25, 70),
        swayFreq: rand(1.8, 4.0),
        phase: rand(0, Math.PI * 2),
        age: -delay,
        maxAge: lifeSec,
        bounceY: null,
        bouncesLeft: 0
      });
    }
    ensureLoop();
  }

  function spawnConfetti(trigger, imgSprite) {
    const count = Math.max(10, Math.min(90, trigger.particle_count || 65));
    const speedScale = (trigger.particle_speed || 100) / 100;
    const gravScale = (trigger.gravity ?? 100) / 100;
    const baseSize = Math.max(14, Math.min(180, trigger.particle_size || 28));
    const tokens = parseTokens(trigger.particle_text, []);
    const lifeSec = Math.max(2.6, (trigger.duration_ms || 5000) / 1000);

    for (let i = 0; i < count; i++) {
      const delay = rand(0, 1.2);
      let sprite;
      let size;
      let isConfetti = false;
      if (imgSprite) {
        sprite = imgSprite;
        size = baseSize * rand(0.75, 1.15);
      } else if (tokens.length > 0 && i % 2 === 0) {
        sprite = getTextSprite(pick(tokens));
        size = baseSize * rand(0.75, 1.15);
      } else {
        sprite = getShapeSprite('confetti', pick(CONFETTI_COLORS));
        size = rand(18, 28);
        isConfetti = true;
      }

      pushParticle({
        kind: isConfetti ? 'confetti' : 'sprite',
        sprite,
        color: '#ffffff',
        x: rand(0, vw),
        y: rand(-100, -16),
        vx: rand(-90, 90) * speedScale,
        vy: rand(90, 220) * speedScale,
        g: 160 * gravScale,
        dragRate: 0.6,
        size,
        rot: rand(0, Math.PI * 2),
        vrot: rand(-5, 5),
        flip: rand(0, Math.PI * 2),
        vflip: rand(5, 10),
        swayAmp: rand(40, 95),
        swayFreq: rand(2.2, 4.4),
        phase: rand(0, Math.PI * 2),
        age: -delay,
        maxAge: lifeSec * rand(0.85, 1.15),
        bounceY: null,
        bouncesLeft: 0
      });
    }
    ensureLoop();
  }

  function spawnThrow(trigger, imgSprite) {
    const count = Math.max(1, Math.min(24, trigger.particle_count || 5));
    const speedScale = (trigger.particle_speed || 100) / 100;
    const gravScale = (trigger.gravity ?? 100) / 100;
    const baseSize = Math.max(36, Math.min(240, trigger.particle_size || 96));
    const tokens = parseTokens(trigger.particle_text, ['🎯', '💥', '❤️', '⭐']);
    const lifeSec = Math.max(2.0, (trigger.duration_ms || 3200) / 1000);

    for (let i = 0; i < count; i++) {
      const fromLeft = Math.random() < 0.5;
      const sx = fromLeft ? -baseSize : vw + baseSize;
      const sy = vh * rand(0.25, 0.72);
      const tx = vw * rand(0.32, 0.68);
      const ty = vh * rand(0.35, 0.72);
      const flight = Math.max(0.45, 0.72 / speedScale);
      const g = 980 * Math.max(0.3, gravScale);
      const vx = (tx - sx) / flight;
      const vy = (ty - sy - 0.5 * g * flight * flight) / flight;
      const delay = i * 0.14;

      pushParticle({
        kind: 'sprite',
        sprite: imgSprite || getTextSprite(pick(tokens)),
        color: '#ffffff',
        x: sx, y: sy,
        vx, vy,
        g,
        dragRate: 0.12,
        size: baseSize * rand(0.85, 1.15),
        rot: 0,
        vrot: (fromLeft ? 1 : -1) * rand(8, 15),
        flip: 0,
        vflip: 0,
        swayAmp: 0,
        swayFreq: 0,
        phase: 0,
        age: -delay,
        maxAge: lifeSec,
        bounceY: ty,
        bouncesLeft: 2
      });
    }
    ensureLoop();
  }

  function spawnAmbient(trigger, imgSprite) {
    const durationSec = Math.max(2.0, (trigger.duration_ms || 6500) / 1000);
    const preset = (trigger.ambient_preset || 'snow').toLowerCase();
    const imgKey = trigger.media_url || '';

    // 同じ環境演出の重複発火はエミッターを増殖させず残り時間を延長
    const existing = ambientEmitters.find(e => e.preset === preset && e.imgKey === imgKey);
    if (existing) {
      existing.remainingSec = Math.max(existing.remainingSec, durationSec);
      ensureLoop();
      return;
    }
    if (ambientEmitters.length >= MAX_AMBIENT_EMITTERS) {
      ambientEmitters.shift();
    }

    ambientEmitters.push({
      preset,
      imgKey,
      sprite: imgSprite,
      size: Math.max(14, Math.min(160, trigger.particle_size || 32)),
      speedScale: (trigger.particle_speed || 100) / 100,
      rate: Math.max(4, Math.min(30, Math.round((trigger.particle_count || 32) / 2.2))),
      accum: 0,
      remainingSec: durationSec
    });
    ensureLoop();
  }

  function emitOneAmbientParticle(em) {
    const p = em.preset;
    const s = em.speedScale;
    if (em.sprite) {
      pushParticle({
        kind: 'sprite', sprite: em.sprite, color: '#ffffff',
        x: rand(0, vw), y: p === 'embers' || p === 'hearts' ? vh + 40 : -40,
        vx: rand(-30, 30) * s, vy: (p === 'embers' || p === 'hearts' ? rand(-160, -70) : rand(60, 150)) * s,
        g: 0, dragRate: 0, size: em.size * rand(0.65, 1.15),
        rot: rand(0, Math.PI * 2), vrot: rand(-2, 2),
        flip: 0, vflip: 0, swayAmp: rand(20, 50), swayFreq: rand(1.5, 3.2), phase: rand(0, 6.28),
        age: 0, maxAge: rand(3.5, 5.5), bounceY: null, bouncesLeft: 0
      });
      return;
    }
    if (p === 'sakura') {
      pushParticle({
        kind: 'confetti', sprite: getShapeSprite('petal', pick(SAKURA_COLORS)), color: '#ffffff',
        x: rand(-60, vw + 60), y: -24,
        vx: rand(55, 130) * s, vy: rand(70, 145) * s,
        g: 0, dragRate: 0, size: rand(16, 28),
        rot: rand(0, 6.28), vrot: rand(-3, 3),
        flip: rand(0, 6.28), vflip: rand(3, 6),
        swayAmp: rand(35, 80), swayFreq: rand(1.8, 3.2), phase: rand(0, 6.28),
        age: 0, maxAge: rand(4.2, 6.5), bounceY: null, bouncesLeft: 0
      });
    } else if (p === 'rain') {
      pushParticle({
        kind: 'rain', sprite: null, color: 'rgba(147, 197, 253, 0.78)',
        x: rand(-60, vw + 120), y: -40,
        vx: -140 * s, vy: rand(880, 1250) * s,
        g: 0, dragRate: 0, size: rand(24, 46),
        rot: 0, vrot: 0, flip: 0, vflip: 0, swayAmp: 0, swayFreq: 0, phase: 0,
        age: 0, maxAge: 1.3, bounceY: null, bouncesLeft: 0
      });
    } else if (p === 'sparkle') {
      pushParticle({
        kind: 'star', sprite: getShapeSprite('star', pick(STAR_COLORS)), color: '#ffffff',
        x: rand(20, vw - 20), y: rand(20, vh - 20),
        vx: rand(-15, 15) * s, vy: rand(-45, -15) * s,
        g: 0, dragRate: 0.4, size: rand(22, 42),
        rot: 0, vrot: rand(-1.5, 1.5), flip: 0, vflip: 0, swayAmp: 0, swayFreq: 0, phase: rand(0, 6.28),
        age: 0, maxAge: rand(1.4, 2.5), bounceY: null, bouncesLeft: 0
      });
    } else if (p === 'hearts') {
      pushParticle({
        kind: 'sprite', sprite: getTextSprite(pick(['💖', '💗', '❤️', '💕'])), color: '#ffffff',
        x: rand(30, vw - 30), y: vh + 30,
        vx: rand(-25, 25) * s, vy: rand(-180, -90) * s,
        g: 0, dragRate: 0, size: rand(26, 48),
        rot: rand(-0.2, 0.2), vrot: rand(-0.8, 0.8), flip: 0, vflip: 0,
        swayAmp: rand(25, 60), swayFreq: rand(1.8, 3.4), phase: rand(0, 6.28),
        age: 0, maxAge: rand(3.5, 5.2), bounceY: null, bouncesLeft: 0
      });
    } else if (p === 'embers') {
      pushParticle({
        kind: 'sprite', sprite: getShapeSprite('glow', pick(EMBER_COLORS)), color: '#ffffff',
        x: rand(0, vw), y: vh + 20,
        vx: rand(-40, 40) * s, vy: rand(-220, -95) * s,
        g: 0, dragRate: 0.3, size: rand(14, 28),
        rot: 0, vrot: 0, flip: 0, vflip: 0,
        swayAmp: rand(30, 75), swayFreq: rand(2.5, 4.8), phase: rand(0, 6.28),
        age: 0, maxAge: rand(2.5, 4.2), bounceY: null, bouncesLeft: 0
      });
    } else {
      pushParticle({
        kind: 'sprite', sprite: getShapeSprite('snow', '#ffffff'), color: '#ffffff',
        x: rand(-20, vw + 20), y: -20,
        vx: rand(-22, 22) * s, vy: rand(55, 135) * s,
        g: 0, dragRate: 0, size: rand(12, 26),
        rot: 0, vrot: 0, flip: 0, vflip: 0,
        swayAmp: rand(20, 55), swayFreq: rand(1.2, 2.5), phase: rand(0, 6.28),
        age: 0, maxAge: rand(4.8, 7.2), bounceY: null, bouncesLeft: 0
      });
    }
  }

  function swapRemove(arr, i) {
    const last = arr.length - 1;
    if (i !== last) arr[i] = arr[last];
    arr.pop();
  }

  function tick(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - lastFrameTs) / 1000));
    lastFrameTs = now;

    ctx.setTransform(canvasScale, 0, 0, canvasScale, 0, 0);
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, vw, vh);

    // 環境エミッター更新
    for (let i = ambientEmitters.length - 1; i >= 0; i--) {
      const em = ambientEmitters[i];
      em.remainingSec -= dt;
      if (em.remainingSec <= 0) {
        swapRemove(ambientEmitters, i);
        continue;
      }
      em.accum += em.rate * dt;
      while (em.accum >= 1 && particles.length < MAX_PARTICLES) {
        em.accum -= 1;
        emitOneAmbientParticle(em);
      }
    }

    // 衝撃リング更新
    if (rings.length > 0) {
      for (let i = rings.length - 1; i >= 0; i--) {
        const rg = rings[i];
        rg.age += dt;
        if (rg.age >= rg.maxAge) { swapRemove(rings, i); continue; }
        const t = rg.age / rg.maxAge;
        ctx.globalAlpha = 1 - t;
        ctx.strokeStyle = rg.color;
        ctx.lineWidth = Math.max(1, 5 * (1 - t));
        ctx.beginPath();
        ctx.arc(rg.x, rg.y, rg.maxR * t, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // パーティクル物理・高速スプライト描画（ctx.save/restore なし・shadowBlur なし）
    let rainBatchStarted = false;
    const sc = canvasScale;

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt;
      if (p.age < 0) continue;
      if (p.age >= p.maxAge) { swapRemove(particles, i); continue; }

      if (p.dragRate > 0) {
        const damp = Math.max(0.5, 1 - p.dragRate * dt);
        p.vx *= damp;
        p.vy = p.vy * damp + p.g * dt;
      } else if (p.g !== 0) {
        p.vy += p.g * dt;
      }

      const swayVx = p.swayAmp ? Math.cos(p.age * p.swayFreq + p.phase) * p.swayAmp : 0;
      p.x += (p.vx + swayVx) * dt;
      p.y += p.vy * dt;
      p.rot += p.vrot * dt;
      if (p.vflip) p.flip += p.vflip * dt;

      if (p.bounceY !== null && p.bouncesLeft > 0 && p.y >= p.bounceY && p.vy > 0) {
        p.y = p.bounceY;
        p.vy = -p.vy * 0.56;
        p.vx *= 0.72;
        p.bouncesLeft--;
        rings.push({ x: p.x, y: p.y, maxR: p.size * 0.9, color: '#ffffff', age: 0, maxAge: 0.36 });
      }

      // 画面外へ完全に抜けた落下／上昇パーティクルを早期破棄
      const margin = p.size * 2.5 + 80;
      if ((p.vy > 0 && p.y > vh + margin) || (p.vy < 0 && p.g === 0 && p.y < -margin)) {
        swapRemove(particles, i);
        continue;
      }

      const lifeRatio = p.age / p.maxAge;
      let alpha = 1;
      if (p.kind === 'star') {
        alpha = Math.sin(lifeRatio * Math.PI);
      } else if (lifeRatio > 0.75) {
        alpha = Math.max(0, 1 - (lifeRatio - 0.75) * 4);
      } else if (lifeRatio < 0.08) {
        alpha = lifeRatio * 12.5;
      }
      if (alpha <= 0.01) continue;

      if (p.kind === 'rain') {
        if (!rainBatchStarted) {
          ctx.setTransform(sc, 0, 0, sc, 0, 0);
          ctx.globalAlpha = 0.78;
          ctx.strokeStyle = 'rgba(147, 197, 253, 0.85)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          rainBatchStarted = true;
        }
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.size * 0.16, p.y + p.size);
        continue;
      }

      const sp = p.sprite;
      if (!sp) continue;

      const aspect = sp.aspect || 1;
      const w = aspect >= 1 ? p.size : p.size * aspect;
      const h = aspect >= 1 ? p.size / aspect : p.size;
      const fy = p.vflip ? Math.cos(p.flip) : 1;

      if (p.rot === 0 && fy === 1) {
        ctx.setTransform(sc, 0, 0, sc, p.x * sc, p.y * sc);
      } else {
        const cos = Math.cos(p.rot) * sc;
        const sin = Math.sin(p.rot) * sc;
        ctx.setTransform(cos, sin, -sin * fy, cos * fy, p.x * sc, p.y * sc);
      }

      ctx.globalAlpha = alpha;
      ctx.drawImage(sp.canvas, -w * 0.5, -h * 0.5, w, h);
    }

    if (rainBatchStarted) {
      ctx.setTransform(sc, 0, 0, sc, 0, 0);
      ctx.stroke();
    }

    ctx.setTransform(sc, 0, 0, sc, 0, 0);
    ctx.globalAlpha = 1;

    if (particles.length > 0 || rings.length > 0 || ambientEmitters.length > 0) {
      requestAnimationFrame(tick);
    } else {
      rafRunning = false;
    }
  }

  // ==================== DOM 固定表示・テロップ管理 ====================
  let queueList = [];
  let isQueuePlaying = false;
  let activeSlots = [];

  function posClass(pos) {
    switch (pos) {
      case 'TopLeft': return 'pos-top_left';
      case 'TopRight': return 'pos-top_right';
      case 'BottomLeft': return 'pos-bottom_left';
      case 'BottomRight': return 'pos-bottom_right';
      case 'FullScreen': return 'pos-full_screen';
      default: return 'pos-center';
    }
  }

  function animClass(anim) {
    switch (anim) {
      case 'PopIn': return 'anim-pop_in';
      case 'SlideUp': return 'anim-slide_up';
      case 'SlideLeft': return 'anim-slide_left';
      case 'Bounce': return 'anim-bounce';
      case 'ZoomSpin': return 'anim-zoom_spin';
      case 'None': return 'anim-none';
      default: return 'anim-fade';
    }
  }

  function clearAllPlayback() {
    queueList = [];
    isQueuePlaying = false;
    activeSlots.forEach((s) => s.stopNow());
    activeSlots = [];
    stage.innerHTML = '';
    particles = [];
    rings = [];
    ambientEmitters = [];
    ctx.setTransform(canvasScale, 0, 0, canvasScale, 0, 0);
    ctx.clearRect(0, 0, vw, vh);
    activeAudioNodes.forEach((n) => { try { n.stop(); } catch (_) {} });
    activeAudioNodes.clear();
    activeFallbackAudios.forEach((a) => { try { a.pause(); } catch (_) {} });
    activeFallbackAudios.clear();
  }

  function showCaptionBanner(trigger) {
    if (!trigger.caption || !trigger.caption.trim()) return;
    const slot = document.createElement('div');
    slot.className = `media-slot ${posClass(trigger.position)} ${animClass(trigger.animation)}`;
    const frame = document.createElement('div');
    frame.className = 'media-frame';
    const cap = document.createElement('div');
    cap.className = 'media-caption';
    cap.textContent = trigger.caption;
    frame.appendChild(cap);
    slot.appendChild(frame);
    stage.appendChild(slot);

    let done = false;
    const stop = (immediate) => {
      if (done) return;
      done = true;
      const rm = () => {
        if (slot.parentNode) slot.parentNode.removeChild(slot);
        activeSlots = activeSlots.filter((s) => s !== h);
      };
      if (immediate) rm();
      else { slot.classList.add('leaving'); setTimeout(rm, 310); }
    };
    const h = { stopNow: () => stop(true) };
    activeSlots.push(h);
    setTimeout(() => stop(false), Math.max(1800, trigger.duration_ms || 3500));
  }

  function playFixedOne(trigger, onDone) {
    const slot = document.createElement('div');
    slot.className = `media-slot ${posClass(trigger.position)} ${animClass(trigger.animation)}`;
    if (trigger.position !== 'FullScreen') {
      const pct = Math.max(10, Math.min(100, trigger.width_percent || 45));
      slot.style.width = `${pct}vw`;
    }

    const frame = document.createElement('div');
    frame.className = 'media-frame';

    let finished = false;
    let timerId = null;
    let videoEl = null;

    const finish = (immediate) => {
      if (finished) return;
      finished = true;
      if (timerId) clearTimeout(timerId);
      if (videoEl) {
        try { videoEl.pause(); videoEl.removeAttribute('src'); videoEl.load(); } catch (_) {}
      }
      const removeDom = () => {
        if (slot.parentNode) slot.parentNode.removeChild(slot);
        activeSlots = activeSlots.filter((s) => s !== handle);
        if (onDone) onDone();
      };
      if (immediate) removeDom();
      else { slot.classList.add('leaving'); setTimeout(removeDom, 310); }
    };

    const handle = { stopNow: () => finish(true) };
    activeSlots.push(handle);

    if (trigger.sound_url) {
      playAudioFile(trigger.sound_url, trigger.sound_volume);
    }

    if (trigger.media_url && trigger.media_kind === 'Video') {
      const v = document.createElement('video');
      videoEl = v;
      v.className = 'media-el';
      v.src = trigger.media_url;
      v.preload = 'auto';
      v.playsInline = true;
      v.autoplay = true;
      const vol = Math.max(0, Math.min(1, ((trigger.volume ?? 80) / 100) * ((mediaConfig.master_volume ?? 80) / 100)));
      v.volume = vol;
      v.muted = vol === 0;
      v.onended = () => finish(false);
      v.onerror = () => finish(true);
      frame.appendChild(v);

      const playPromise = v.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(() => {
          v.muted = true;
          v.play().catch(() => finish(true));
        });
      }
      const maxDur = trigger.duration_ms > 0 ? trigger.duration_ms : 60000;
      timerId = setTimeout(() => finish(false), maxDur);
    } else if (trigger.media_url && trigger.media_kind === 'Audio') {
      playAudioFile(trigger.media_url, trigger.volume);
      const dur = trigger.duration_ms > 0 ? trigger.duration_ms : 3000;
      timerId = setTimeout(() => finish(false), dur);
    } else if (trigger.media_url) {
      const img = document.createElement('img');
      img.className = 'media-el';
      img.decoding = 'async';
      img.src = trigger.media_url;
      img.onerror = () => finish(true);
      frame.appendChild(img);
      const dur = trigger.duration_ms > 0 ? trigger.duration_ms : 4000;
      timerId = setTimeout(() => finish(false), dur);
    } else {
      const dur = trigger.duration_ms > 0 ? trigger.duration_ms : 3500;
      timerId = setTimeout(() => finish(false), dur);
    }

    if (trigger.caption && trigger.caption.trim()) {
      const cap = document.createElement('div');
      cap.className = 'media-caption';
      cap.textContent = trigger.caption;
      frame.appendChild(cap);
    }

    slot.appendChild(frame);
    stage.appendChild(slot);
  }

  async function playParticleEffect(trigger) {
    if (trigger.sound_url) {
      playAudioFile(trigger.sound_url, trigger.sound_volume);
    }
    const imgSprite = trigger.media_url && trigger.media_kind === 'Image'
      ? await loadSpriteImage(trigger.media_url)
      : null;

    switch (trigger.effect_type) {
      case 'Cracker': spawnCracker(trigger, imgSprite); break;
      case 'Drop': spawnDrop(trigger, imgSprite); break;
      case 'Confetti': spawnConfetti(trigger, imgSprite); break;
      case 'Throw': spawnThrow(trigger, imgSprite); break;
      case 'Ambient': spawnAmbient(trigger, imgSprite); break;
      default: break;
    }
    showCaptionBanner(trigger);
  }

  function pumpQueue() {
    if (isQueuePlaying || queueList.length === 0) return;
    isQueuePlaying = true;
    const next = queueList.shift();
    playFixedOne(next, () => {
      isQueuePlaying = false;
      pumpQueue();
    });
  }

  function handleTrigger(trigger) {
    if (!enabled || !trigger) return;
    const mode = mediaConfig.playback_mode || 'Overlay';
    const isFixed = !trigger.effect_type || trigger.effect_type === 'Fixed';

    if (mode === 'Replace') {
      clearAllPlayback();
      if (isFixed) playFixedOne(trigger, null);
      else playParticleEffect(trigger);
      return;
    }

    if (!isFixed) {
      playParticleEffect(trigger);
      return;
    }

    if (mode === 'Overlay') {
      const maxC = Math.max(1, mediaConfig.max_concurrent || 8);
      while (activeSlots.length >= maxC) {
        activeSlots[0].stopNow();
      }
      playFixedOne(trigger, null);
    } else {
      queueList.push(trigger);
      pumpQueue();
    }
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.type === 'snapshot') {
          config = Object.assign(config, data.config || {});
          if (data.media_config) mediaConfig = data.media_config;
          if (typeof data.media_enabled === 'boolean') enabled = data.media_enabled;
          applyDesign();
        } else if (data.type === 'media_trigger') {
          handleTrigger(data.trigger);
        } else if (data.type === 'media_config') {
          if (data.media_config) mediaConfig = data.media_config;
          if (typeof data.enabled === 'boolean') enabled = data.enabled;
        } else if (data.type === 'clear_media') {
          clearAllPlayback();
        } else if (data.type === 'config_updated') {
          config = Object.assign(config, data.config || {});
          applyDesign();
        }
      } catch (e) { console.error(e); }
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }
  applyDesign();
  connect();
</script>
</body>
</html>
