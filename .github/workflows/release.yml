name: 自動ビルド ＆ GitHub リリース (MSI)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースバージョン（例: 0.3.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    name: Windows 64bit ビルド ＆ MSI リリース公開
    runs-on: windows-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: バージョン番号を決定
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $raw = "${{ github.event.inputs.version }}".Trim().TrimStart('v')
            $tag = "v$raw"
          } else {
            $tag = "${{ github.ref_name }}"
            $raw = $tag.TrimStart('v')
          }
          echo "version=$raw" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          $isPre = if ($raw -match '(?i)pre') { "true" } else { "false" }
          echo "is_prerelease=$isPre" >> $env:GITHUB_OUTPUT
          $buildName = if ($raw -match '^([0-9]+\.[0-9]+\.[0-9]+)') { $Matches[1] } else { $raw }
          echo "build_name=$buildName" >> $env:GITHUB_OUTPUT
          Write-Host "Target release version: $raw (tag: $tag, is_prerelease: $isPre, build_name: $buildName)"

      - name: pubspec.yaml と rust/Cargo.toml のバージョンを同期
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          (Get-Content pubspec.yaml -Raw) -replace '(?m)^version:\s*[^\r\n]+', "version: $v+1" | Set-Content pubspec.yaml -NoNewline
          (Get-Content rust/Cargo.toml -Raw) -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$v`"" | Set-Content rust/Cargo.toml -NoNewline

      - name: Rust セットアップ
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Flutter セットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: .NET SDK セットアップ（WiX Toolset v5 用）
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Rust テスト実行
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Flutter 依存取得 ＆ 静的解析 ＆ テスト
        shell: pwsh
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Flutter Windows (64bit) リリースビルド
        run: flutter build windows --release --build-name=${{ steps.ver.outputs.build_name }}

      - name: Windows MSI インストーラー生成 ＆ SHA256 算出 (WiX v5)
        shell: pwsh
        run: |
          pwsh -File installer/build_msi.ps1 -Version "${{ steps.ver.outputs.version }}" -SkipFlutterBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: CHANGELOG.md から該当バージョンの変更内容を抽出
        id: notes
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $lines = Get-Content "CHANGELOG.md" -Encoding UTF8
          $target = "## [$v]"
          $collecting = $false
          $extracted = New-Object System.Collections.Generic.List[string]

          foreach ($line in $lines) {
            $trimmed = $line.Trim()
            if ($trimmed.StartsWith("## [")) {
              if ($collecting) { break }
              if ($trimmed.StartsWith($target)) {
                $collecting = $true
                continue
              }
            } elseif ($collecting) {
              $extracted.Add($line)
            }
          }

          $body = ($extracted -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($body)) {
            $body = "## Stosup v$v`n`nこのバージョンの詳細変更履歴はコミットログをご確認ください。"
          }
          if ("${{ steps.ver.outputs.is_prerelease }}" -eq "true") {
            $body += "`n`n---`n### 先行版（pre）について`n- 本リリースは先行検証用のプレリリース版のため、アプリ内からの自動更新は行われません。`n- お試しいただく場合は、事前に Stosup のバックアップ機能でデータを保存したうえで ``Stosup-v$v-x64.msi`` を手動ダウンロードしてご利用ください。"
          } else {
            $body += "`n`n---`n### ダウンロード方法`n- **Windows 10/11 (64bit)**: ``Stosup-v$v-x64.msi`` をダウンロードして実行してください。`n- すでに Stosup をインストール済みの場合は、アプリ内の自動アップデート機能からそのまま更新できます。"
          }
          Set-Content -Path "release_notes.md" -Value $body -Encoding UTF8
          Get-Content "release_notes.md"

      - name: GitHub Release 作成 ＆ MSI インストーラー公開
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Stosup ${{ steps.ver.outputs.tag }}"
          body_path: release_notes.md
          prerelease: ${{ steps.ver.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.ver.outputs.is_prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: false
          files: |
            dist/Stosup-v*-x64.msi
            dist/SHA256SUMS.txt
