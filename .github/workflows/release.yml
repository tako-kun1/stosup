name: 自動ビルド ＆ GitHub リリース

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースバージョン（例: 0.1.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    name: Windows 64bit ビルド ＆ リリース公開
    runs-on: windows-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: バージョン番号を決定
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $raw = "${{ github.event.inputs.version }}".Trim().TrimStart('v')
            $tag = "v$raw"
          } else {
            $tag = "${{ github.ref_name }}"
            $raw = $tag.TrimStart('v')
          }
          echo "version=$raw" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Target release version: $raw (tag: $tag)"

      - name: pubspec.yaml と rust/Cargo.toml のバージョンを同期
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          (Get-Content pubspec.yaml -Raw) -replace '(?m)^version:\s*[^\r\n]+', "version: $v+1" | Set-Content pubspec.yaml -NoNewline
          (Get-Content rust/Cargo.toml -Raw) -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$v`"" | Set-Content rust/Cargo.toml -NoNewline

      - name: Rust セットアップ
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Flutter セットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Rust テスト実行
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Flutter 依存取得 ＆ 静的解析 ＆ テスト
        shell: pwsh
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Flutter Windows (64bit) リリースビルド
        run: flutter build windows --release --build-name=${{ steps.ver.outputs.version }}

      - name: Inno Setup の確認・セットアップ
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup (ISCC.exe) が見つかりませんでした"
          }

      - name: Windows インストーラー生成 ＆ SHA256 算出
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" "installer\stosup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exeName = "Stosup-Setup-v$v.exe"
          $exePath = Join-Path "dist" $exeName
          if (-not (Test-Path $exePath)) {
            throw "インストーラーが見つかりません: $exePath"
          }
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()
          "$hash  $exeName" | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding UTF8
          Get-Content "dist\SHA256SUMS.txt"

      - name: CHANGELOG.md から該当バージョンの変更内容を抽出
        id: notes
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $lines = Get-Content "CHANGELOG.md" -Encoding UTF8
          $target = "## [$v]"
          $collecting = $false
          $extracted = New-Object System.Collections.Generic.List[string]

          foreach ($line in $lines) {
            $trimmed = $line.Trim()
            if ($trimmed.StartsWith("## [")) {
              if ($collecting) { break }
              if ($trimmed.StartsWith($target)) {
                $collecting = $true
                continue
              }
            } elseif ($collecting) {
              $extracted.Add($line)
            }
          }

          $body = ($extracted -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($body)) {
            $body = "## Stosup v$v`n`nこのバージョンの詳細変更履歴はコミットログをご確認ください。"
          }
          $body += "`n`n---`n### ダウンロード方法`n- **Windows 10/11 (64bit)**: ``Stosup-Setup-v$v.exe`` をダウンロードして実行してください。`n- すでに Stosup をインストール済みの場合は、アプリ内の自動アップデート機能からそのまま更新できます。"
          Set-Content -Path "release_notes.md" -Value $body -Encoding UTF8
          Get-Content "release_notes.md"

      - name: GitHub Release 作成 ＆ インストーラー公開
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Stosup ${{ steps.ver.outputs.tag }}"
          body_path: release_notes.md
          generate_release_notes: false
          files: |
            dist/Stosup-Setup-v*.exe
            dist/SHA256SUMS.txt
